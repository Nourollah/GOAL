default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # list of supported hooks: https://pre-commit.com/hooks.html
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-yaml
        # mkdocs.yml uses `!!python/name:` tags (MkDocs Material); --unsafe
        # checks YAML syntax only instead of constructing those objects.
        args: [--unsafe]
      - id: debug-statements
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-toml
      - id: check-case-conflict
      - id: check-added-large-files

  # python code formatting
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--line-length, "99"]

  # python import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]

  # python upgrading syntax to newer version
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py313-plus]

  # python docstring coverage checking
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args:
          [
            --verbose,
            --fail-under=80,
            --ignore-init-module,
            --ignore-init-method,
            --ignore-module,
            --ignore-nested-functions,
            --ignore-magic,
            --ignore-property-decorators,
            -vv,
          ]
        # Docstring coverage is measured on the package. Tests document
        # themselves through descriptive names; scripts are one-off tools.
        exclude: ^(tests|scripts)/

  # python check (PEP8), programming errors and code complexity
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          [
            "--extend-ignore",
            "E203,E402,E501,F401,F841,RST2,RST301,RST304",
            "--exclude",
            "logs/*,data/*",
          ]
        additional_dependencies: [flake8-rst-docstrings==0.3.0]

  # python security linter.  Skipped checks:
  #   B101 — assert_used (we use asserts in tests by design)
  #   B108 — hardcoded /tmp path (scratch directories in adapters)
  #   B110 — try/except/pass (best-effort cleanup in MD observer/runner)
  #   B301 — pickle.loads (LMDB dataset reader stores pickled data)
  #   B311 — random not crypto-safe (used in tutorial-generation script)
  #   B403 — pickle import (paired with B301)
  #   B614 — unsafe torch.load (loads trusted checkpoints from configured paths)
  #   B404 — subprocess import  ┐ GOAL launches its own tools on purpose (mtt for
  #   B603 — subprocess call    ┘ UPET fine-tuning, git for archive metadata, the
  #                               CLIs in tests), always with argument lists and
  #                               never through a shell (shell=True is still flagged).
  - repo: https://github.com/PyCQA/bandit
    rev: "1.8.3"
    hooks:
      - id: bandit
        args: ["-s", "B101,B108,B110,B301,B311,B403,B404,B603,B614"]

  # yaml formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types: [yaml]
        exclude: "environment.yaml"

  # shell scripts linter
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # word spelling linter
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          - --skip=logs/**,data/**,*.ipynb,pixi.lock
          # datas: list of Data objects; equil: equilibration file names;
          # te: train/val/test split; Nd/Te: element symbols;
          # eference: from "**r**eference" in the RESPA acronym.
          - --ignore-words-list=datas,equil,te,nd,eference

  # jupyter notebook cell output clearing
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
