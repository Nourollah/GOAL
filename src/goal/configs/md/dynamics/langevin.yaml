# Langevin NVT thermostat (DynamicsFactory template)
#
# Not read by `goal-simulate` (its Simulation always uses ASE Langevin with
# the top-level timestep_fs / friction / temperature_K keys).  Instantiate it
# yourself: hydra.utils.instantiate(cfg, atoms=atoms).
_target_: goal.md.core.md_factory.DynamicsFactory.create
_convert_: none

key: langevin_ase
timestep_fs: 1.0 # fs
temperature_K: 300.0
friction_per_fs: 0.05 # 1/fs (≈ the 0.5 ASE units this template used to pass raw)
fixcm: true
