# @package _global_
# MTS-RESPA simulation: ML fast calculator + QM slow correction
# This config is the default entry point for multi-timescale MD.
#
# Usage:
#   goal-simulate-mts fast_calculator.checkpoint=path/to/model.simurgh \
#       slow_calculator.orca_path=/opt/orca/orca
#   goal-simulate-mts fast_calculator.checkpoint=path/to/model.simurgh slow_calculator=null   # fast only (debug)
#
# The RESPA integrator runs `mts_ratio` fast steps per slow step.
# Slow forces = F_QM - F_ML  (force decomposition, exact MTS)
#
# The `# @package _global_` line above is required: without it Hydra nests
# this file under `md.mts.simulations` and the run finds no `molecule:`.

molecule:
  key: from_smiles
  smiles: CCO # ethanol; override from CLI

fast_calculator:
  type: goal_model # ML model from goal.ml training
  checkpoint: ??? # required: path/to/model.ckpt
  device: cpu
  # OR use: type: flashmd, type: mace

slow_calculator: # set to null to run fast-only (debug)
  type: orca
  orca_path: ??? # required if slow_calculator used
  keywords: "EnGrad wB97M-V def2-TZVPD RIJCOSX TightSCF DEFGRID3"
  charge: 0
  multiplicity: 1

mts:
  timestep_fs: 1.0 # inner (fast) timestep
  mts_ratio: 4 # slow step every 4 fast steps → 4 fs effective outer dt
  total_steps: 10000 # outer steps
  temperature_K: 300.0 # Langevin temperature (null = NVE)
  friction: 0.01 # Langevin friction (1/fs)
  log_interval: 50
  trajectory_file: trajectory.traj
  log_file: md.log
  output_dir: outputs/md/mts
  chunk_size: 50
  show_progress: true
