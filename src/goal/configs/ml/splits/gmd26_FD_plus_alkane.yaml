# @package data
########################################################
# GMD-26 split "gmd26_FD_plus_alkane"
#
# The FragmentDuplication training set plus ONE alkane trajectory (octane,
# C8H18, a Chain Extension OOD molecule).  Validation (TestID) and the OOD
# set (TestOOD) are Duplication's own, unchanged.
#
# Why: the monoacid training compositions make none of the six diacid OOD
# energies identifiable; adding one alkane makes all of them identifiable.
# Running this split next to plain Duplication separates missing
# information from genuine compositional failure.  A model trained on this
# split must never be evaluated on Chain Extension.
#
# Use with any GMD experiment config (it sets the GMD task and molecules):
#   goal-train --config-name <experiment> +splits@data=gmd26_FD_plus_alkane
########################################################

dataset_type: gmd
task: fragment_duplication
extra_train_molecules: [Alkanes/C8H18]
train_dir: null
val_dir: null
test_dir: null
train_paths: null
val_paths: null
test_paths: null
root: ${paths.data_dir}/GMD # graph cache (raw files: the Hugging Face cache)
