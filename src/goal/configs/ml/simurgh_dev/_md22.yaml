# @package _global_
# ^ REQUIRED (config group simurgh_dev): see _base.yaml.
########################################################
# SIMURGH — shared MD22 settings.  Not a run; compose it from
# simurgh_dev_md22_<system>.yaml, which sets the system and its standard
# training size.  The test set is every frame not used for training or
# validation (cap it with data.test_size, e.g. 200 frames as in the best
# published MD22 numbers).  MFC is off.
# E0: MD22 (PBE+MBD) ships no isolated atoms, and each model sees one
# composition, so atomic_energies.mode: dataset (least squares on the
# training set) only removes a constant and changes no metric.  Never reuse
# GMD's values (PBE D3BJ def2-TZVP) here.
# Dispersion: MD22 labels contain MBD, not D3; keep dispersion off.
########################################################

defaults:
  - _base
  - _self_

data:
  dataset_type: md22
  train_dir: null
  val_dir: null
  test_dir: null
  root: ${paths.data_dir}/md22
  molecule: Ac-Ala3-NHMe
  train_size: 6000
  val_size: 500
  test_size: null
  seed: 42
  monitor_test_during_training: false
  batch_size: 4
  compute_fragment_index: false
  fragment_smarts: null

trainer:
  max_epochs: 1000

model:
  backbone:
    atomic_energies:
      mode: dataset
      values: null # fitted on the training set by goal-train
