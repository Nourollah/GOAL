########################################################
# GOAL ML Hyperparameter-Optimisation Configuration
# Model  : SIMURGH ARACE (simurgh_arace) — default architecture
# Dataset: GMD-26 FragmentDuplication (O₂CₙH₂ₙ, PBE/def2-SVP DFT)
#
# Composes the base experiment config (simurgh_gmd26.yaml) and adds a
# Ray Tune search space over the ARACE hyperparameters.  Uses the
# project's standard hparams_search format (see
# src/goal/configs/hparams_search/ray_tune.yaml for the schema reference).
#
# Run with:
#   goal-tune --config-dir src/goal/configs/ml --config-name simurgh_gmd26_hpo
# Requires: pip install -e '.[tune]'   (ray[tune] + optuna)
#
# NOTE — the goal-tune entry point builds the model directly from the
# config (no dataset-derived injection), so two keys that goal-train
# normally injects are pinned here explicitly:
#   * model.backbone.elements       (GMD-26 contains H, C, O)
#   * atomic_energies stays "learned" (no LSQ regression in tune path)
########################################################

defaults:
  - simurgh_gmd26
  - _self_

task_name: "simurgh_gmd26_hpo"

model:
  backbone:
    # goal-tune does not auto-extract elements from the dataset the way
    # goal-train does — pin them for the GMD-26 HCO chemistry.
    elements: [1, 6, 8]

hparams_search:
  method: ray

  # --- Trial budget ---
  num_samples: 30 # total trials to run
  max_epochs: 100 # max epochs per trial (early stopped by scheduler)
  metric: val_forces/forces_mae # metric to optimise
  mode: min
  experiment_name: simurgh_arace_gmd26_hpo
  storage_path: null # null → auto (logs/ray_tune/)

  # --- Scheduler: early stopping of bad trials ---
  scheduler: asha
  grace_period: 10 # min epochs before pruning (ASHA)
  reduction_factor: 3 # keep top 1/3 of trials (ASHA)

  # --- Search algorithm ---
  # null → random search; optuna → Bayesian optimisation
  search_algorithm: optuna

  # --- Search space over the ARACE hyperparameters ---
  # Each key is a dotted Hydra config path into the base config.
  # Types: uniform, loguniform, quniform, choice, randint, grid
  #
  # NOTE: model.head.irreps_in interpolates
  # ${model.backbone.artisan.hidden_irreps} but interpolations are
  # resolved BEFORE Ray merges its samples, so the head readout keeps
  # the base width.  This is harmless — the ARACE backbone populates
  # node_energies, so the head's own scalar readout is never applied.
  search_space:
    model.backbone.num_rounds:
      type: choice
      values: [1, 2, 3]
    model.backbone.artisan.hidden_irreps:
      type: choice
      values:
        - "16x0e + 16x1o + 16x2e"
        - "32x0e + 32x1o + 32x2e"
        - "32x0e + 32x1o"
    model.backbone.artisan.num_layers:
      type: choice
      values: [1, 2]
    model.backbone.artisan.radial_hidden:
      type: choice
      values: [32, 64]
    model.backbone.artisan.n_scalar_out:
      type: choice
      values: [16, 32]
    model.backbone.share_artisan_weights:
      type: choice
      values: [true, false]
    training.optimizer.lr:
      type: loguniform
      lower: 1.0e-4
      upper: 1.0e-2
    training.optimizer.weight_decay:
      type: loguniform
      lower: 1.0e-8
      upper: 1.0e-4
