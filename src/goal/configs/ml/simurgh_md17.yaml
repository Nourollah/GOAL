########################################################
# GOAL ML Experiment Configuration
# Model  : SIMURGH — E(3)-equivariant artisan-bank force field
# Dataset: MD17 aspirin (rMD17 revised split)
#
# Self-contained config. Every parameter the project supports is
# listed here — either set to its value for this experiment, or
# documented in comments showing what else is available.
# No other file needs to be opened to understand what is possible.
########################################################

# ─────────────────────────────────────────────────────
# EXPERIMENT METADATA
# ─────────────────────────────────────────────────────
experiment:
  name: "simurgh_md17"
  description: "SIMURGH on MD17 aspirin (rMD17, 950 train / 50 val)"
  tags: ["simurgh", "md17", "aspirin"]

seed: 42
task_name: "simurgh_md17"
run_name_suffix: "" # optional tag, prepend "_": e.g. "_aspirin"
run_name: ${now:%Y-%m-%d_%H-%M-%S}_${data.dataset_type}_${model.backbone.name}${run_name_suffix}

hydra:
  run:
    dir: ${paths.log_dir}/${task_name}/runs/${run_name}
  sweep:
    dir: ${paths.log_dir}/${task_name}/multiruns/${run_name}
    subdir: ${hydra.job.num}
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${task_name}.log

# ─────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────
paths:
  root_dir: ${oc.env:PROJECT_ROOT,${oc.env:PWD}}
  data_dir: ${paths.root_dir}/data
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}

# ─────────────────────────────────────────────────────
# DATA
# ─────────────────────────────────────────────────────
# dataset_type options:
#   "xyz", "hdf5", "lmdb", "trajectory",
#   "md17"  — MD17/rMD17 benchmark (goal.ml.data.benchmarks.md17)
#   "qm9"   — QM9 quantum chemistry (goal.ml.data.benchmarks.qm9)
#   "ani1"/"ani1x" — ANI-1/ANI-1x (goal.ml.data.benchmarks.ani1)
#
# MD17 loading (dataset_type: "md17"):
#   Uses a fixed train/val split by index rather than directory or file lists.
#   molecule: aspirin | ethanol | malonaldehyde | naphthalene |
#             salicylic_acid | toluene | uracil | benzene
#   revised: true = rMD17 (higher-quality forces); false = original MD17
#   train_size / val_size: number of structures per split
#   dtype: float64 for MD17 (double precision DFT data)
# ─────────────────────────────────────────────────────
data:
  dataset_type: md17

  root: ${paths.data_dir}/md17
  molecule: aspirin
  revised: true # rMD17 (revised, higher quality forces)
  cutoff: 5.0 # Å, must match model.backbone.cutoff
  train_size: 950 # training structures (max 950 for rMD17 aspirin)
  val_size: 50 # validation structures
  seed: 42
  dtype: float64 # MD17 uses double precision

  # DataLoader
  batch_size: 6 # aspirin has ~21 atoms; 6 = ~126 atoms per batch
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: null

  # These are not used for md17 dataset_type but kept for reference:
  # energy_key: energy
  # forces_key: forces
  # merge_strategy: sequential
  # split_ratio: [0.8, 0.1, 0.1]
  # split_seed: 42

# ─────────────────────────────────────────────────────
# MODEL
# ─────────────────────────────────────────────────────
# backbone.name options:
#   "simurgh_arace" (default ARACE architecture — different config keys,
#   see src/goal/configs/ml/simurgh_gmd26.yaml), "simurgh" (legacy ACE-first, this
#   file; alias "simurgh_ace_first"), "simurgh_monolithic",
#   "monolithic_arace", "hyperspec", "invariant_gnn", "monolithic_example"
#
# head.name options:
#   "energy_forces", "dual_forces", "direct_forces",
#   "energy", "stress", "dipole", "scalar", "multi", null
# ─────────────────────────────────────────────────────
model:
  backbone:
    name: simurgh
    cutoff: ${model.backbone.dressing_kwargs.cutoff}

    # NOTE: the optional `fragment_interaction` / `adaptive_gate` add-ons are
    # ARACE-only — they attach to an artisan+ACE round, which this legacy
    # backbone does not have, and `SimurghBackbone.__init__` rejects those
    # keys.  See src/goal/configs/ml/simurgh_gmd26.yaml (modular ARACE) or
    # monolithic_arace_gmd26.yaml, where both are documented inline and
    # enabled by uncommenting.  MD17 is single-molecule anyway, so
    # fragment CA would see K = 1 fragment and act as a per-structure bias.

    # Atomic-energy baseline — elements are discovered automatically from
    # the training set. You never need to specify which elements are present.
    #
    # mode options:
    #   "learned"  — jointly optimised from zero (slowest, always valid)
    #   "dataset"  — least-squares regression on training set (recommended)
    #   "provided" — hand-set DFT values; every dataset element must be listed
    #                or training raises a clear error before starting.
    atomic_energies:
      mode: dataset # least-squares regression on training set
      values: null # auto-populated by train.py
      compute_from_dataset: false

    scale: null

    # elements: removed — automatically extracted from the training set
    #           by train.py via compute_unique_elements().

    dressing_kwargs:
      embedding_dim: 64
      # Smaller model than GMD26 — MD17 is a benchmark with 950 training
      # structures; a smaller model reduces overfitting risk.
      hidden_channels: 16 # vs 32 for GMD26

      # lmax=2 is standard for MD17 benchmark comparisons
      lmax: 2

      num_radial_basis: 8
      radial_mlp_hidden: 32
      cutoff: 5.0 # MD17 standard cutoff

      # Fewer interactions for the smaller dataset
      num_interactions: 1 # vs 2 for GMD26
      num_message_passing: 1

      body_order: 1
      element_conditioned: true
      per_layer_readout: true
      symmetric_contraction: false
      avg_num_neighbors: null
      agg_norm_exponent: 1.0
      num_elements: 9

    artisan_config:
      scalar_channels: 16 # narrower than GMD26
      expert_type: linear
      hidden_dims: [64, 32] # narrower than GMD26 [128, 64]
      dropout_rate: 0.0 # small dataset; dropout can hurt

      # Transformer expert (alternative to linear):
      # expert_type: transformer
      # transformer_heads: 4
      # transformer_layers: 2

      rare_artisan:
        enabled: false
        min_pair_frequency: 0.01
        pair_embed_dim: 16

      pair_counts: null

    compute_pairwise_forces: false

  head:
    name: energy_forces
    irreps_in: "${model.backbone.dressing_kwargs.hidden_channels}x0e+${model.backbone.dressing_kwargs.hidden_channels}x1o+${model.backbone.dressing_kwargs.hidden_channels}x2e"
    hidden_dim: 64 # narrower than GMD26
    compute_stress: false
    # mode / correction_weight / pairwise_correction_weight only apply to
    # name: dual_forces — remove this comment block when switching heads.

# ─────────────────────────────────────────────────────
# TRAINER
# ─────────────────────────────────────────────────────
# trainer.max_epochs is authoritative — governs both Lightning and
# the scheduler T_max. Do NOT use training.max_epochs.
#
# accelerator options: "cpu", "gpu", "mps", "tpu", "auto"
# precision options: "32-true", "bf16-mixed", "16-mixed", "64-true"
# strategy options: "auto", "ddp", "fsdp", "deepspeed_zero1/2/3"
# ─────────────────────────────────────────────────────
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}

  min_epochs: 1
  max_epochs: 200 # MD17 converges faster than GMD26

  accelerator: cpu
  devices: 1
  num_nodes: 1
  precision: "32"
  strategy: auto

  check_val_every_n_epoch: 1
  val_check_interval: null
  log_every_n_steps: 1

  gradient_clip_val: null
  gradient_clip_algorithm: "norm"
  accumulate_grad_batches: 1
  num_sanity_val_steps: 2
  inference_mode: false

  deterministic: false
  detect_anomaly: false
  enable_model_summary: true
  enable_progress_bar: true
  sync_batchnorm: false

# ─────────────────────────────────────────────────────
# TRAINING HYPERPARAMETERS
# ─────────────────────────────────────────────────────
training:
  gradient_clip: 10.0
  checkpoint_dir: ${paths.output_dir}/checkpoints
  compile_model: false
  compile:
    mode: "default"
    fullgraph: false
    dynamic: null
  slurm_mode: false

  performance:
    float32_matmul_precision: highest
    cudnn_benchmark: false
    cudnn_deterministic: false

  optimizer:
    lr: 5.0e-4 # MD17 typically uses smaller LR than GMD26
    weight_decay: 1.0e-6
    amsgrad: true
    min_lr: 1.0e-7
    scheduler_type: cosine_warmup
    warmup_epochs: 5 # shorter warmup for smaller dataset
    scheduler:
      patience: 20
      factor: 0.5

  ema:
    enabled: true
    decay: 0.99

  # Noise augmentation — 0.005 Å standard for MD17 benchmarks
  position_noise_std: 0.005

  # Simplified curriculum for MD17 (small dataset converges quickly)
  stages:
    - name: "energy_only"
      epochs: 20
      loss_weights:
        energy: 1.0
        forces: 0.0
        gate_reg: 1.0e-4

    - name: "energy_forces"
      epochs: null # open-ended — runs to max_epochs
      loss_weights:
        energy: 1.0
        forces: 1.0
        gate_reg: 1.0e-4

  # MD17 standard loss: energy + forces with equal weights
  # normalize_by_n_atoms: false for MD17 (single molecule, fixed atom count)
  losses:
    - name: energy
      fn: mae
      weight: 1.0
      normalize_by_n_atoms: false # fixed atom count — normalisation redundant

    - name: forces
      fn: mae
      weight: 1.0
      normalize_by_n_atoms: false

    - name: gate_reg
      fn: mse
      weight: 1.0e-4

  strict_stage_labels: false

# ─────────────────────────────────────────────────────
# CHECKPOINTING
# ─────────────────────────────────────────────────────
# Three independent pools: top_k, interval, last.
# See simurgh_gmd26.yaml for full documentation of all options.
# ─────────────────────────────────────────────────────
checkpoint_manager:
  _target_: goal.ml.training.callbacks.checkpoint_manager.GOALCheckpointManager
  dirpath: ${paths.output_dir}/checkpoints

  top_k:
    enabled: true
    k: 5
    metric: "val_forces/forces_mae"
    mode: "min"

  interval:
    enabled: true
    every_n_epochs: 10 # less frequent for shorter runs
    keep_last_n: 3

  last:
    enabled: true
    filename: "last.ckpt"

  # Self-contained .simurgh archives — see simurgh_gmd26.yaml for docs.
  save_archive: true
  archive_interval: false

# ─────────────────────────────────────────────────────
# CALLBACKS
# ─────────────────────────────────────────────────────
# See simurgh_gmd26.yaml for full documentation of all available callbacks.
# ─────────────────────────────────────────────────────
callbacks:
  rich_progress_bar:
    _target_: goal.ml.training.callbacks.progress.GOALRichProgressBar

  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 1

  # Early stopping for MD17 (plateau metric is energy+forces loss)
  # early_stopping:
  #   _target_: lightning.pytorch.callbacks.EarlyStopping
  # Check right after validation, not at the end of the training epoch:
  # a run resumed from a checkpoint saved after validation first closes
  # that finished epoch with no metrics logged, which strict mode rejects.
  check_on_train_epoch_end: false
  #   monitor: "val_forces/forces_mae"
  #   patience: 30
  #   mode: "min"
  #   min_delta: 1.0e-6
  #   strict: true
  #   check_finite: true

  # backbone_finetuning:
  # ema_weight_averaging:
  # grad_accumulation:
  # swa:
  # throughput_monitor:

# ─────────────────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────────────────
# ── LOGGER SECTIONS (what lands where in W&B / TensorBoard) ─────────
# The text before the first "/" is the section a curve is filed under:
#
#   {split}/         total (the weighted loss), plus any loss component
#                    that is neither energy nor forces
#   {split}_energy/  the energy loss term, energy_mae_per_atom,
#                    energy_rmse_per_atom, energy_round_{L}
#   {split}_forces/  the forces loss term, forces_mae, forces_rmse,
#                    forces_cosine_similarity, forces_magnitude_mae,
#                    newton_violation and its _x/_y/_z components
#   {split}_gate/    every gate diagnostic (gate_mean_round_{L},
#                    aux_loss, gate_reg, artisan/…) — numerous, for
#                    occasional inspection, never on the progress bar
#
# {split} is train, val (the in-distribution set) or test (the
# out-of-distribution set: logged every validation epoch when
# data.monitor_test_during_training is on, otherwise only by an explicit
# trainer.test() run).  Select on val_*, read test_*.
#
# Full section reference: src/goal/configs/ml/simurgh_gmd26.yaml
#
# See simurgh_gmd26.yaml for full documentation of all available loggers.
# ─────────────────────────────────────────────────────
logger:
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: "${paths.output_dir}"
    name: "csv_logs"
    prefix: ""

  # wandb:
  #   _target_: lightning.pytorch.loggers.wandb.WandbLogger
  #   project: "goal-simurgh-md17"
  #   entity: null
  #   save_dir: "${paths.output_dir}"
  #   offline: false
  #   log_model: false
  #   tags: ["simurgh", "md17"]

  # tensorboard:
  # mlflow:
  # neptune:
  # aim:
  # comet:

# ─────────────────────────────────────────────────────
# DISTRIBUTED TRAINING
# ─────────────────────────────────────────────────────
# See simurgh_gmd26.yaml for full documentation of all strategy options.
# ─────────────────────────────────────────────────────
strategy:
  name: auto
  find_unused_parameters: false
  static_graph: false
  gradient_as_bucket_view: true
  bucket_cap_mb: 25
  process_group_backend: nccl
  auto_wrap_policy: size
  size_based_min_params: 1000000
  activation_checkpointing: true
  cpu_offload: false
  sharding_strategy: full_shard
  state_dict_type: full
  stage: 3
  offload_optimizer: false
  offload_parameters: false
  overlap_comm: true
  contiguous_gradients: true
  allgather_bucket_size: 200000000
  reduce_bucket_size: 200000000
  logging_level: 30

# ─────────────────────────────────────────────────────
# RESUME / EXTEND
# ─────────────────────────────────────────────────────
# An INTERRUPTED run picks itself up with nothing set here: on launch,
# training.checkpoint_dir/last.ckpt is loaded if it exists, and the
# GOALCheckpointManager pools are restored from checkpoint_state.json.
#
# This block is for continuing a run that ALREADY FINISHED. Raise the
# budget and point resume.from at the old run's checkpoints:
#
#   goal-train --config-name <this file> \
#       trainer.max_epochs=3000 \
#       resume.from=logs/<task_name>/runs/<old_run>/checkpoints
#
# The continued run writes its own checkpoints under its own output
# directory; the old run's files are read for pool ranking but never
# deleted. A launch with nothing left to train (max_epochs already
# reached) exits immediately — which is what stops SLURM from requeueing
# a completed job.
resume:
  # Run directory, checkpoint directory, or .ckpt file to continue from.
  # null = this run's own training.checkpoint_dir (plain auto-resume).
  from: null

  # What to do with the restored LR schedule when max_epochs changes.
  # Lightning restores T_max / base_lrs / last_epoch from the checkpoint,
  # so the new budget never reaches the scheduler on its own — and since
  # CosineAnnealingLR is periodic with period 2*T_max, the LR would climb
  # BACK UP its curve over the added epochs, undoing the run.
  #   stretch — re-aim the schedule at the new budget: the LR lands where
  #             a run configured with the new max_epochs from the start
  #             would be at this epoch, and keeps annealing down.
  #   restart — fresh cosine cycle over the added epochs only, from
  #             training.optimizer.lr (SGDR-style warm restart).
  #   keep    — leave the restored schedule as-is (the old behaviour;
  #             only for reproducing a pre-existing resume).
  lr_schedule: stretch

# Dataset statistics derived from the training set before the model is built
# (elements, atomic reference energies, scale, avg_num_neighbors, pair_counts).
# goal-train records them in checkpoints/config.yaml, with the dataset they
# came from, and reuses them when this run is resumed or extended — they are
# not recomputed, and the model is rebuilt exactly as trained even if the
# training data has changed since (a change is reported).
dataset_stats:
  # Reuse the values recorded with the checkpoint on resume / extension.
  reuse: true
  # Statistics to derive again anyway, or "all": elements, atomic_energies,
  # scale, avg_num_neighbors, pair_counts.  An explicit value under
  # model.backbone is kept; otherwise it is computed from the current data.
  # scale / atomic_energies / avg_num_neighbors can always be changed;
  # elements / pair_counts shape the model, so they only work on resume if
  # the result still matches the checkpoint.
  recompute: []

# ckpt_path: legacy alias for resume.from — still honoured, and the key
# goal-eval reads to pick a checkpoint to evaluate.
ckpt_path: null

# ─────────────────────────────────────────────────────
# HYPERPARAMETER SEARCH
# ─────────────────────────────────────────────────────
# See simurgh_gmd26.yaml for full search configuration options.
hparams_search: null
