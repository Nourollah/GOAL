# @package _global_
########################################################
# GOAL fine-tuning config — UMA / FairChem foundation model
#
#   goal-train --config-name finetune/uma
#
# Same structure as finetune/mace.yaml. The backbone `uma_finetune` is a
# monolithic nn.Module (head: null).
#
# NOTE: loading a UMA model as a raw trainable nn.Module is not a publicly
# documented fairchem API — this config is ready to run as soon as that path
# exists; until then the backbone raises UnsupportedOperationError with a link
# to the fairchem docs. See docs/finetuning/uma.md.
########################################################

experiment:
  name: "finetune_uma"
  description: "UMA head-only fine-tuning"
  tags: ["finetune", "uma"]

seed: 42
task_name: "finetune_uma"
run_name_suffix: ""
run_name: ${now:%Y-%m-%d_%H-%M-%S}_${data.dataset_type}_${model.backbone.name}${run_name_suffix}

hydra:
  run:
    dir: ${paths.log_dir}/${task_name}/runs/${run_name}
  sweep:
    dir: ${paths.log_dir}/${task_name}/multiruns/${run_name}
    subdir: ${hydra.job.num}
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${task_name}.log

paths:
  root_dir: ${oc.env:PROJECT_ROOT,${oc.env:PWD}}
  data_dir: ${paths.root_dir}/data
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}

data:
  dataset_type: xyz
  root: ${paths.data_dir}/finetune
  split_ratio: [0.9, 0.1]
  split_seed: 42
  cutoff: 6.0 # match the UMA model's cutoff
  batch_size: 4
  num_workers: 0
  pin_memory: false
  energy_key: energy
  forces_key: forces
  # Remap custom label keys (MACE/FairChem-style; overrides the two lines above):
  # key_mapping: {energy: REF_energy, forces: REF_forces, stress: virial}

model:
  backbone:
    name: uma_finetune
    checkpoint: "uma-s-1" # UMA model name or checkpoint path
    head: omol # UMA dataset-type embedding: omol (organic) / omat (inorganic)
    strategy: head_only # head_only | full | lora
    lora_rank: 4
    lora_alpha: 16.0
    lora_target_modules: null
    dtype: float64
    reestimate_e0s: true
    device: cpu
  head: null

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 1
  max_epochs: 100
  accelerator: auto
  devices: 1
  num_nodes: 1
  precision: "64"
  strategy: auto
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  gradient_clip_val: null
  accumulate_grad_batches: 1
  num_sanity_val_steps: 2
  inference_mode: false

training:
  gradient_clip: 10.0
  checkpoint_dir: ${paths.output_dir}/checkpoints
  compile_model: false
  slurm_mode: false
  performance:
    float32_matmul_precision: highest
    cudnn_benchmark: false
    cudnn_deterministic: false
  optimizer:
    lr: 1.0e-4
    weight_decay: 1.0e-6
    amsgrad: true
    min_lr: 1.0e-7
    scheduler_type: cosine
    scheduler:
      patience: 25
      factor: 0.5
  ema:
    enabled: true
    decay: 0.99
  losses:
    - name: energy
      fn: mae
      weight: 1.0
      normalize_by_n_atoms: true
    - name: forces
      fn: mae
      weight: 10.0
      normalize_by_n_atoms: true
  strict_stage_labels: false

checkpoint_manager:
  _target_: goal.ml.training.callbacks.checkpoint_manager.GOALCheckpointManager
  dirpath: ${paths.output_dir}/checkpoints
  top_k:
    enabled: true
    k: 3
    metric: "val_forces/forces_mae"
    mode: "min"
  interval:
    enabled: true
    every_n_epochs: 5
    keep_last_n: 3
  last:
    enabled: true
    filename: "last.ckpt"
  save_archive: true
  archive_interval: false

callbacks:
  foundation_e0:
    _target_: goal.ml.training.callbacks.foundation.FoundationE0Callback
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 1

logger:
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: "${paths.output_dir}"
    name: "csv_logs"
    prefix: ""

strategy:
  name: auto
  find_unused_parameters: false

auto_resume: false
ckpt_path: null
hparams_search: null
