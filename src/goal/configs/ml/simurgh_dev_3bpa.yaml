########################################################
# SIMURGH (simurgh_dev) on 3BPA: 500 training structures at 300 K; tests at
# 300 K, 600 K and 1200 K and the dihedral slices.  The data are not in
# the repository: put the standard files under data/3BPA/ (train_300K.xyz,
# test_300K.xyz, test_600K.xyz, test_1200K.xyz, test_dih.xyz).  Evaluate
# each test set with goal-eval '+data.test_paths=[...]'.
# E0: the base carries the GMD isolated-atom energies (PBE D3BJ def2-TZVP).
# 3BPA (DFT, not GMD's) labels use other DFT settings: replace atomic_energies.values with
# matching isolated-atom energies, otherwise the network has to learn the
# constant offset.
#
#   goal-train --config-name simurgh_dev_3bpa
########################################################

defaults:
  - simurgh_dev/_base
  - _self_

experiment:
  name: "simurgh_dev_3bpa"
  description: "SIMURGH on 3BPA"
  tags: ["simurgh", "simurgh_dev", "3bpa"]

task_name: "simurgh_dev_3bpa"

data:
  energy_key: energy
  forces_key: forces
  dataset_type: xyz
  train_dir: null
  val_dir: null
  test_dir: null
  root: null
  train_paths: ["${paths.data_dir}/3BPA/train_300K.xyz"]
  val_paths: ["${paths.data_dir}/3BPA/test_300K.xyz"]
  test_paths: ["${paths.data_dir}/3BPA/test_1200K.xyz"]
  monitor_test_during_training: false
  batch_size: 5
  compute_fragment_index: false
  fragment_smarts: null

trainer:
  max_epochs: 2000
