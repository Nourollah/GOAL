########################################################
# SIMURGH (simurgh_dev) on GMD-26 FragmentFusion
# Training: fusion of fragments; OOD: fused molecules.
# Validation = TestID (checkpoint selection); TestOOD is logged as test_*
# every epoch and never selected on.
#
#   goal-train --config-name simurgh_dev_gmd26_FF
########################################################

defaults:
  - simurgh_dev/_base
  - _self_

experiment:
  name: "simurgh_dev_gmd26_FF"
  description: "SIMURGH on GMD-26 FragmentFusion"
  tags: ["simurgh", "simurgh_dev", "gmd", "FragmentFusion"]

task_name: "simurgh_dev_gmd26_FF"

data:
  task: fragment_fusion # GMD from the Hugging Face Hub, downloaded on first use
  root: ${paths.data_dir}/GMD # graph cache (raw files: the Hugging Face cache)
  fragment_smarts:
    [
      "[CX4]-[CX4]",
      "[CX4]-[CX3]",
      "[CX3]-[CX3]",
      "[CX4]-[OX2H1]",
      "[CX3]-[OX2H1]",
    ]

# Multi-scale fragment consistency: on in the GMD configs (half-space
# windows, two levels, b = r_c); its removal is an ablation arm.
model:
  backbone:
    mfc:
      enabled: true
