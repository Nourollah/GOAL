experiment:
  name: "simurgh_dev_abl_s04_radial_per_layer_linear_mlp"
  description: "SIMURGH ablation: radial expansion linear in layer 1, MLP in layer 2 (the source order is ambiguous)"

model:
  backbone:
    radial:
      per_layer: [linear, mlp]
