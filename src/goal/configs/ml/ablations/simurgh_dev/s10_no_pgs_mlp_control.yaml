# @package _global_
# ^ REQUIRED (config group ablations/simurgh_dev): see simurgh_dev/_base.yaml.
########################################################
# SIMURGH ablation, stage 10: PGS off, last-layer MLP 16 -> 32 (equal-parameter control)
# Base: simurgh_dev_gmd26_FD (B0 with MFC).  Screen with seed 42; seeds 43
# and 44 only if the change exceeds 2x the base seed s.d.
#
#   goal-train --config-name ablations/simurgh_dev/s10_no_pgs_mlp_control seed=42
# Another task: replace the first default (e.g. /simurgh_dev_gmd26_FF).
########################################################

defaults:
  - /simurgh_dev_gmd26_FD
  - _self_

task_name: "simurgh_dev_abl_s10_no_pgs_mlp_control"
experiment:
  name: "simurgh_dev_abl_s10_no_pgs_mlp_control"
  description: "SIMURGH ablation: PGS off, last-layer MLP 16 -> 32 (equal-parameter control)"

model:
  backbone:
    readout:
      pgs: false
      mlp_hidden: 32
