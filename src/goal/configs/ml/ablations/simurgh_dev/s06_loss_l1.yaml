# @package _global_
# ^ REQUIRED (config group ablations/simurgh_dev): see simurgh_dev/_base.yaml.
########################################################
# SIMURGH ablation, stage 6: Huber -> L1 (error norm)
# Base: simurgh_dev_gmd26_FD (B0 with MFC).  Screen with seed 42; seeds 43
# and 44 only if the change exceeds 2x the base seed s.d.
#
#   goal-train --config-name ablations/simurgh_dev/s06_loss_l1 seed=42
# Another task: replace the first default (e.g. /simurgh_dev_gmd26_FF).
########################################################

defaults:
  - /simurgh_dev_gmd26_FD
  - _self_

task_name: "simurgh_dev_abl_s06_loss_l1"
experiment:
  name: "simurgh_dev_abl_s06_loss_l1"
  description: "SIMURGH ablation: Huber -> L1 (error norm)"

training:
  losses:
    - { name: energy, fn: l1, weight: 1.0 }
    - {
        name: forces,
        fn: l1,
        error: norm,
        normalize_by_n_atoms: false,
        weight: 100.0,
      }
