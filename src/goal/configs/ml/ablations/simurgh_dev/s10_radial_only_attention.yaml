########################################################
# SIMURGH ablation, stage 10: attention scores from the distance only
# Base: simurgh_dev_gmd26_FD (B0 with MFC).  Screen with seed 42; seeds 43
# and 44 only if the change exceeds 2x the base seed s.d.
#
#   goal-train --config-name ablations/simurgh_dev/s10_radial_only_attention seed=42
# Another task: replace the first default (e.g. /simurgh_dev_gmd26_FF).
########################################################

defaults:
  - /simurgh_dev_gmd26_FD
  - _self_

task_name: "simurgh_dev_abl_s10_radial_only_attention"
experiment:
  name: "simurgh_dev_abl_s10_radial_only_attention"
  description: "SIMURGH ablation: attention scores from the distance only"

model:
  backbone:
    attention:
      mode: radial
