#
#   goal-train --config-name ablations/simurgh_dev/s09_strictly_local_no_mfc seed=42
# Another task: replace the first default (e.g. /simurgh_dev_gmd26_FF).
########################################################

defaults:
  - /simurgh_dev_gmd26_FD
  - _self_

task_name: "simurgh_dev_abl_s09_strictly_local_no_mfc"
experiment:
  name: "simurgh_dev_abl_s09_strictly_local_no_mfc"
  description: "SIMURGH ablation: 1 layer, correlation 4, MFC off"

model:
  backbone:
    num_interactions: 1
    correlation: 4
    product_basis: ladder
    mfc:
      enabled: false
