# @package _global_
# ^ REQUIRED (config group ablations/simurgh_dev): see simurgh_dev/_base.yaml.
########################################################
# SIMURGH ablation, stage 4: radial MLP in layer 1, linear radial map in layer 2
# Base: simurgh_dev_gmd26_FD (B0 with MFC).  Screen with seed 42; seeds 43
# and 44 only if the change exceeds 2x the base seed s.d.
#
#   goal-train --config-name ablations/simurgh_dev/s04_radial_per_layer_mlp_linear seed=42
# Another task: replace the first default (e.g. /simurgh_dev_gmd26_FF).
########################################################

defaults:
  - /simurgh_dev_gmd26_FD
  - _self_

task_name: "simurgh_dev_abl_s04_radial_per_layer_mlp_linear"
experiment:
  name: "simurgh_dev_abl_s04_radial_per_layer_mlp_linear"
  description: "SIMURGH ablation: radial MLP in layer 1, linear radial map in layer 2"

model:
  backbone:
    radial:
      per_layer: [mlp, linear]
