########################################################
# GOAL ML Experiment Configuration
# Model  : SIMURGH — DEFAULT: ARACE architecture
#          (ARtisan + Atomic Cluster Expansion, modular)
#          nodes → [artisan layer → ACE block] × N rounds → E, F
# Dataset: GMD-26 FragmentDuplication (O₂CₙH₂ₙ, PBE/def2-SVP DFT)
#
# ── SWITCHING BETWEEN THE TWO SIMURGH ARCHITECTURES ──
# The architecture is selected purely by model.backbone.name:
#
#   ARACE (default, this file)
#     model.backbone.name: simurgh_arace
#     Potential artisans are the PRIMARY computation at every layer;
#     an ACE block aggregates the artisan edge features back onto
#     nodes between artisan layers.  Per-round energy decomposition.
#
#   ACE-first (legacy)
#     model.backbone.name: simurgh        # alias: simurgh_ace_first
#     ACE-style environment dressing runs FIRST; the artisan bank is
#     an auxiliary readout at the end.  The legacy backbone uses
#     different config keys (dressing_kwargs / artisan_config) — use
#     the ready-made legacy experiment file instead of editing this
#     one:  goal-train --config-name simurgh_ace_first_gmd26
#
#   Monolithic ARACE (research / ablation)
#     model.backbone.name: monolithic_arace  with  head: null
#     Same physics as simurgh_arace but self-contained (computes its
#     own forces):  goal-train --config-name monolithic_arace_gmd26
#
# Self-contained config. Every parameter the project supports is
# listed here — either set to its value for this experiment, or
# documented in comments showing what else is available.
# No other file needs to be opened to understand what is possible.
########################################################

# ─────────────────────────────────────────────────────
# EXPERIMENT METADATA
# ─────────────────────────────────────────────────────
experiment:
  name: "simurgh_gmd26"
  description: "SIMURGH ARACE on GMD-26 FragmentDuplication (HCO elements)"
  tags: ["simurgh", "arace", "gmd", "fragment_duplication"]

seed: 42

# task_name: used by Hydra to namespace the output directory.
# Log dir = {paths.log_dir}/{task_name}/runs/{run_name}
task_name: "simurgh_gmd26"

# run_name_suffix: optional descriptive tag appended to the run name.
# null or "" → no suffix; any string → appended with "_".
# Example: "fragment_duplication" → 2026-06-02_18-30_trajectory_simurgh_fragment_duplication
run_name_suffix: "_fragment_duplication" # prepend "_"; set to "" for no suffix

# run_name: leaf of the log directory AND the W&B run name — always in sync.
# Format: YYYY-MM-DD_HH-MM-SS_{dataset_type}_{backbone_name}{suffix}
run_name: ${now:%Y-%m-%d_%H-%M-%S}_${data.dataset_type}_${model.backbone.name}${run_name_suffix}

# ─────────────────────────────────────────────────────
# HYDRA OUTPUT DIRECTORY
# ─────────────────────────────────────────────────────
# Overrides Hydra's default outputs/YYYY-MM-DD/HH-MM-SS/ structure.
# Mirrors what src/goal/configs/hydra/default.yaml set for the old multi-file system.
# Result: logs/{task_name}/runs/{run_name}/
hydra:
  run:
    dir: ${paths.log_dir}/${task_name}/runs/${run_name}
  sweep:
    dir: ${paths.log_dir}/${task_name}/multiruns/${run_name}
    subdir: ${hydra.job.num}
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${task_name}.log

# ─────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────
# root_dir falls back to $PWD when PROJECT_ROOT is not set.
# Override: PROJECT_ROOT=/your/path pixi run train ...
paths:
  root_dir: ${oc.env:PROJECT_ROOT,${oc.env:PWD}}
  data_dir: ${paths.root_dir}/data
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}

# ─────────────────────────────────────────────────────
# DATA
# ─────────────────────────────────────────────────────
# dataset_type options:
#   "xyz"        — ExtXYZ files (.xyz, .extxyz)
#   "hdf5"       — HDF5 pre-processed graphs (.h5, .hdf5)
#   "lmdb"       — FairChem/OCP LMDB format (.lmdb)
#   "trajectory" — ASE trajectory files (.traj, .db)
#   "md17"       — MD17/rMD17 benchmark (goal.ml.data.benchmarks.md17)
#   "qm9"        — QM9 quantum chemistry (goal.ml.data.benchmarks.qm9)
#   "ani1"/"ani1x" — ANI-1/ANI-1x (goal.ml.data.benchmarks.ani1)
#
# Loading modes (mutually exclusive — use exactly one):
#
#   Mode 1 — single root, auto-split (tries train.xyz/val.xyz first;
#             falls back to splitting by split_ratio):
#     root: /path/to/data
#     split_ratio: [0.8, 0.1, 0.1]
#
#   Mode 2 — explicit per-split file lists:
#     train_paths: [/path/a.xyz, /path/b.xyz]
#     val_paths:   [/path/val.xyz]
#     test_paths:  [/path/test.xyz]   # optional
#
#   Mode 3 — merged multi-source, then auto-split:
#     root: [/path/A, /path/B]
#     split_ratio: [0.8, 0.1, 0.1]
#     merge_strategy: "sequential"    # or "random"
#
#   Mode 4 — directory per split (used here for GMD):
#     train_dir: /path/train/
#     val_dir:   /path/val/
#     test_dir:  /path/test/          # optional
# ─────────────────────────────────────────────────────
data:
  dataset_type: trajectory

  # Mode 4 — directory-based per-split (GMD directory layout)
  train_dir: ${paths.data_dir}/GMD/FragmentDuplication/Training
  val_dir: ${paths.data_dir}/GMD/FragmentDuplication/TestID
  test_dir: ${paths.data_dir}/GMD/FragmentDuplication/TestOOD
  root: ${paths.data_dir}/GMD/FragmentDuplication # for logging

  # ── MONITOR THE OOD SET DURING TRAINING ──────────────────────────
  # true → the test split above also runs through the validation loop
  # every validation epoch, reported in its OWN logger sections
  # (test/, test_energy/, test_forces/) beside the val ones.  With
  # val_dir=TestID and test_dir=TestOOD that makes the generalisation
  # gap a curve you watch while training instead of a number you learn
  # afterwards, and the two sets are never averaged together.
  #
  # Costs one extra forward pass over test_dir per validation epoch
  # (no backward), so it scales with len(TestOOD)/len(TestID).
  #
  # Do NOT point checkpoint_manager.top_k.metric or
  # early_stopping.monitor at a test/ curve: selecting on a set makes
  # it a second validation set and its OOD number stops meaning
  # anything.  Select on val_*, read test_*.
  #
  # false → unchanged behaviour: the test split is loaded only by an
  # explicit trainer.test() run.
  monitor_test_during_training: true

  # Neighbour cutoff radius (Å). Must match model.backbone.cutoff.
  # Increasing slows O(N·r³) but improves long-range interactions.
  cutoff: 8.0

  # DataLoader
  batch_size: 48 # structures per mini-batch; 8–32 typical for atomistics
  num_workers: 0 # 0 = single-process (required for Python 3.14 / some envs)
  pin_memory: false # true when using CUDA; false for CPU
  persistent_workers: false # true only when num_workers > 0
  prefetch_factor: null # null = PyTorch default; set 2–4 with num_workers > 0

  # Dataset kwargs forwarded to the dataset class (not used by DataModule itself)
  energy_key: energy # key in ASE atoms.info / ExtXYZ properties
  forces_key: forces # key in ASE atoms.arrays / ExtXYZ arrays

  # Custom label keys (MACE/FairChem-style). If your file stores the labels
  # under different names, map them here — this overrides the *_key entries
  # above. A configured key missing from a frame raises a clear error listing
  # the keys that ARE present (instead of silently dropping the label).
  # key_mapping:
  #   energy: REF_energy   # -> atoms.info["REF_energy"]
  #   forces: REF_forces   # -> atoms.arrays["REF_forces"]
  #   stress: virial       # -> atoms.info["virial"]

  # Merge strategy for multi-file splits (Mode 2/3/4)
  # "sequential" — concatenate in sorted order (reproducible)
  # "random"     — shuffle once at load time
  merge_strategy: sequential

  # Auto-split ratio (Mode 1/3 only, ignored for Mode 4)
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 97

  # ── Fragment labels (for model.backbone.fragment_interaction) ─────
  # compute_fragment_index: attach a (N,) int64 `fragment_index` to every
  # graph — connected-component labels under a SHORT covalent cutoff, so
  # separate molecules get separate labels even though they sit inside the
  # (much longer) interaction cutoff above.  Requires no supervision: the
  # labels are a pure function of the geometry.
  #
  #   one connected molecule   → K = 1 label   → module is a no-op
  #   two separated fragments  → K = 2 labels  → they exchange messages
  #   N isolated atoms         → K = N labels  → all-pairs (see max_fragments)
  #
  # Computed ONCE at dataset-load time (never in the training loop) and
  # renumbered per graph during batching, so labels never collide across
  # structures in a mini-batch.  Left `true` even though this file ships
  # with the fragment channel disabled, so enabling it is a one-line
  # uncomment and nothing else: the cost is a one-off O(N²) distance scan
  # per frame at load, negligible next to the neighbour list.  Set `false`
  # to skip it entirely when no run will need labels.
  compute_fragment_index: true

  # fragment_covalent_cutoff: bond threshold in Å.  1.8 Å covers the
  # covalent bonds of light elements (C-C 1.54, C-H 1.09, O-H 0.96,
  # C=O 1.21) while staying below any non-bonded contact.  Raise towards
  # ~2.4 Å for metal-ligand bonds (e.g. MOF nodes); lower it to split
  # weakly-bound fragments apart.  Periodic structures are handled with
  # the minimum image convention, so a molecule straddling a cell
  # boundary stays one fragment.
  fragment_covalent_cutoff: 1.8

  # ── fragment_scheme: HOW a structure is split ─────────────────────
  # Measured on this dataset's own molecules (butanoic acid, 14 atoms /
  # decanoic acid, 32 atoms — GMD structures are single covalently
  # connected acids, NOT separated fragments despite the subset names):
  #
  #   scheme             rdkit?  K on C4 acid  K on C10 acid  splits on
  #   ------------------ ------  ------------  -------------  ----------------
  #   connected            no          1              1       distance < cutoff
  #   rdkit_components     yes         1              1       perceived bonds
  #   rotatable            yes         5             11       non-ring single
  #                                                           bonds (CH2 groups)
  #   brics                yes         2              2       retrosynthetic
  #                                                           rules — snips -OH
  #   recap                yes         3              3       RECAP rules
  #
  # WHICH TO PICK
  #   connected — fragments are physically separate MOLECULES, so the
  #     model's fragment channel represents genuine non-bonded
  #     interaction.  The only scheme that needs no chemistry perception,
  #     handles PBC correctly, and never fails (radicals, ions, metals).
  #     On a single connected molecule it gives K=1 and the fragment
  #     module is an exact no-op — which is the case for ALL GMD subsets.
  #   rotatable — cuts one molecule into chemically meaningful groups
  #     (CH3/CH2/COOH), turning the fragment channel into a COARSE-GRAINED
  #     INTRAMOLECULAR pathway: pooled groups talk directly instead of
  #     atom-by-atom along the chain.  Most useful when the fragment
  #     cutoff exceeds the atom cutoff so the two ends of a long chain
  #     couple in one step (for decanoic acid, 8 of 55 centroid pairs sit
  #     beyond 8 Å — exactly the ones local message passing cannot see).
  #   brics / recap — retrosynthetic disconnections (amide, ester, ether,
  #     C-N).  Saturated chains have almost none, so both are nearly
  #     no-ops here; they earn their keep on functionalised chemistry.
  #   rdkit_components — connected components of the *perceived* molecule.
  #     Normally identical to `connected`; kept so you can verify that,
  #     and so bond perception rather than a distance threshold decides
  #     what counts as bonded.
  #
  # COST: the four rdkit schemes run bond perception (xyz2mol) once per
  # distinct topology, cached on the bond graph — an MD trajectory whose
  # connectivity never changes pays for it once, not once per frame.
  # CAVEAT: perception is not periodic-aware; a molecule wrapped across a
  # cell boundary may be split (a warning is emitted).  `connected` is
  # the only PBC-correct scheme.
  #
  # THIS RUN: `custom`, so the fragments are exactly the groups named in
  # fragment_smarts below — one per CH2, one per CH3, one for the COOH.
  fragment_scheme: custom

  # Total charge handed to rdkit's bond perception (rdkit schemes only).
  # Wrong here means perception fails or invents bond orders — set it for
  # ionic systems.
  fragment_charge: 0

  # What to do when perception fails (radical, odd valence, distorted MD
  # frame mid-bond-breaking):
  #   "fallback" — warn ONCE and use `connected` for that structure
  #   "raise"    — stop the run; use this when a silently degraded
  #                decomposition would invalidate the experiment
  fragment_on_failure: raise

  # ── HINTING: telling the fragmenter about your chemistry ──────────
  # BRICS/RECAP rules are hard-coded inside rdkit — no settings file, and
  # patching its module globals is process-wide and version-fragile — so
  # the hints live here instead, versioned with the experiment.
  #
  # fragment_keep_groups: SMARTS whose matched atoms MUST end up in the
  # same fragment.  Works with EVERY scheme, in two ways: a bond is never
  # cut when both ends lie inside one match, and the final labels are
  # merged so the guarantee holds even if the base scheme had already
  # separated them.  Overlapping groups merge transitively.
  #
  #   measured on decanoic acid (this dataset's C10 molecule):
  #     rotatable                     K=11  [4,3,3,3,3,3,3,3,3,2,2]
  #     rotatable + keep "C(=O)O"     K=10  [4,4,3,3,3,3,3,3,3,3]
  #                                   ^ carboxyl held as one 4-atom unit
  #                                     instead of shedding its OH
  #     brics                         K= 2  [30,2]
  #     brics     + keep "C(=O)O"     K= 1  [32]
  #                                   ^ CAREFUL: BRICS' only cut on a
  #                                     saturated acid IS the carboxyl
  #                                     C-OH bond, so protecting that
  #                                     group turns BRICS into a no-op
  #                                     on this dataset
  #
  # Needs rdkit for the SMARTS matching, so setting it alongside
  # `connected` adds a perception step `connected` otherwise avoids.
  fragment_keep_groups: null # e.g. ["C(=O)O", "c1ccccc1", "[NX3][CX3]=O"]

  # fragment_smarts: bond patterns to CUT.  Used ONLY by
  # `fragment_scheme: custom` — setting it next to brics/rotatable/recap
  # does nothing (those carry their own rules), and a warning says so at
  # startup.  Each pattern must identify one bond unambiguously: either
  # exactly two atoms, or the two ends marked with atom maps :1 and :2.
  # An ambiguous pattern is rejected at startup, never guessed at.
  #
  # NOTE the direction of the specification: you name the bonds BETWEEN
  # the groups you want, not the groups themselves.  Fragments are then
  # whatever the molecule falls apart into.  To say "the carboxyl is one
  # fragment and the alkyl chain is another", cut the one bond joining
  # them — a single pattern, not one per group.
  #
  #   measured on decanoic acid (this dataset's C10 molecule):
  #     ["[CX4]-[CX3]"]                  K= 2  carboxyl [OOCH] | chain
  #                                            [C9H19]  ← head/tail split
  #     ["[CX4]-[CX4]"]                  K= 9  every sp3 C-C cut
  #     ["[CX4]-[CX4]","[CX4]-[CX3]"]    K=10  carboxyl + one group per C
  #     ["[C:1](=O)-[O:2]"]              K= 2  just the acid C-O (= brics)
  #
  # A bare string is accepted as a single pattern, so both
  # `fragment_smarts: "[CX4]-[CX3]"` and `["[CX4]-[CX3]"]` work.
  #
  # THIS RUN — "every CH2 a fragment, every CH3 a fragment, COOH a
  # fragment".  Read the two patterns as the two kinds of bond that
  # SEPARATE those groups:
  #
  #   [CX4]-[CX4]   sp3 carbon to sp3 carbon → every chain carbon is cut
  #                 away from its neighbours, so each keeps only its own
  #                 hydrogens: CH2 groups inside the chain, CH3 at the end
  #                 (the H count follows the carbon, nothing extra needed)
  #   [CX4]-[CX3]   sp3 carbon to the sp2 carboxyl carbon → detaches the
  #                 chain from COOH.  CX3 is what distinguishes the
  #                 carboxyl carbon (3 connections: =O, -O, -C) from a
  #                 chain carbon (CX4, four connections)
  #
  # Nothing cuts inside COOH, so its C, both O and the acid H stay one
  # fragment.  Verified on this dataset: decanoic acid (C10, 32 atoms) →
  # K=10 = [COOH] + 8x[CH2] + [CH3]; butanoic acid (C4, 14 atoms) →
  # K=4 = [COOH] + 2x[CH2] + [CH3].
  fragment_smarts: ["[CX4]-[CX4]", "[CX4]-[CX3]"]

# ─────────────────────────────────────────────────────
# MODEL
# ─────────────────────────────────────────────────────
# backbone.name options:
#   "simurgh_arace"       — DEFAULT: ARACE (this file). Potential artisans
#                          primary at every layer + ACE aggregation. Modular.
#   "simurgh"             — legacy ACE-dressing-first artisan-bank model
#                          (alias: "simurgh_ace_first"). Uses different keys
#                          (dressing_kwargs / artisan_config) — see
#                          src/goal/configs/ml/simurgh_ace_first_gmd26.yaml.
#   "simurgh_monolithic"  — legacy SIMURGH without backbone/head split
#   "monolithic_arace"   — ARACE monolithic (research/ablation), head: null
#   "hyperspec"          — E(3)-equivariant GNN (HyperSpec)
#   "invariant_gnn"      — invariant SchNet-like GNN
#   "monolithic_example" — minimal reference monolithic model
#
# head.name options (set null for monolithic backbones):
#   "energy_forces"  — energy + autograd forces F=-∂E/∂r (conservative)
#   "dual_forces"    — energy + forces with selectable mode
#   "direct_forces"  — energy + direct equivariant force projection
#   "energy"         — energy only (no forces; for datasets without forces)
#   "stress"         — energy + virial stress (periodic systems)
#   "dipole"         — dipole moment from learned partial charges
#   "scalar"         — generic per-structure scalar (HOMO, LUMO, ...)
#   "multi"          — run multiple heads simultaneously
#   null             — monolithic backbone handles output directly
# ─────────────────────────────────────────────────────
model:
  backbone:
    name: simurgh_arace

    # ── ARACE stacking ──────────────────────────────────────────────
    # Each round = one artisan layer (per-element-pair equivariant
    # artisans on edges, contributing a per-layer pair energy) + one
    # ACE block (edge → node aggregation of the artisan features with
    # equivariant linear + residual + RMS norm):
    #   nodes → edges (artisan) → nodes (ACE) → edges (artisan) → ...
    # E_total = E_atomic + scale × Σ_L E_artisan_L,  F = -∂E/∂r
    num_rounds: 2 # number of artisan + ACE rounds

    # true  → one artisan bank shared by every round (fewer params)
    # false → independent bank per round (default, more expressive)
    share_artisan_weights: false

    # Neighbour cutoff radius (Å) — MUST match data.cutoff, so it is
    # interpolated from there.  Override both together.
    cutoff: ${data.cutoff}

    # Initial node features: atomic-number embedding lookup projected
    # into the artisans' equivariant space.  There is NO separate
    # environment-dressing phase — the first artisan layer operates
    # directly on these embeddings.
    embedding_dim: 64
    num_elements: 9 # embedding table size; must be > max(Z) in the data (H..F)

    # Mean neighbours per atom for the ACE aggregation normalisation.
    # null = auto-computed from the training set by train.py.
    avg_num_neighbors: null

    # ── Equivariant pair artisans (primary learning component) ──────
    # One artisan per unordered element pair per round (shared across
    # rounds when share_artisan_weights is true).  Architecture must be
    # "equivariant" — ARACE is equivariant throughout; invariants
    # appear only in each layer's scalar energy readout.
    # num_layers and the width fields (hidden_irreps, radial_hidden,
    # n_scalar_out, final_hidden) are all tunable — see the HPO search
    # space in src/goal/configs/ml/simurgh_gmd26_hpo.yaml.
    artisan:
      architecture: equivariant
      hidden_irreps: "16x0e + 16x1o + 16x2e" # node/pair equivariant width
      num_layers: 1 # 1 = TP only; >1 adds residual EquivLinear+Norm layers
      num_rbf: 8 # Bessel radial basis functions
      radial_hidden: 32 # radial MLP hidden width
      n_scalar_out: 16 # invariant scalars before the energy MLP
      final_hidden: 16 # energy MLP hidden width
      element_conditioned: true # modulate TP weights by destination element
      n_elements: auto # conditioning-table rows = max(Z)+1 of the elements (absent → legacy 120)

    # ── Atomic-energy baseline ──────────────────────────────────────
    # Subtracts per-element reference energies so the model learns
    # residuals rather than absolute energies (O(thousand eV)).
    #
    # Elements are discovered automatically from the training set.
    #
    # mode options:
    #   "learned"  — nn.Parameter, zero-init, jointly optimised.
    #                Works without any prior knowledge.
    #   "dataset"  — least-squares regression on training set.
    #                Leave values: null; computed automatically.
    #   "provided" — hand-set values from isolated-atom DFT (eV), e.g.
    #                PBE/def2-SVP for this dataset:
    #                  1: -13.595298   # H
    #                  6: -1028.481145 # C
    #                  7: -1483.895483 # N
    #                  8: -2041.117735 # O
    atomic_energies:
      mode: provided
      values:
        1: -13.595298 # H
        6: -1028.481145 # C
        7: -1483.895483 # N
        8: -2041.117735 # O
      compute_from_dataset: false # set true to force "dataset" mode

    # Multiplicative scale on the artisan interaction energy.
    # null = 1.0 for "learned" mode, auto-computed for "dataset"/"provided".
    scale: null

    # elements: never set here — automatically extracted from the
    #           training set by train.py via compute_unique_elements().
    #           K elements → K*(K+1)/2 pair artisans per round.

    # ══ OPTIONAL ADD-ON MODULES ═════════════════════════════════════
    # Two independent add-ons hang off every ARACE round.  Both are OFF
    # in this file.  Each is enabled purely by the PRESENCE of its config
    # section, so the whole switch is a comment:
    #
    #   ENABLE  — uncomment the `fragment_interaction:` /
    #             `adaptive_gate:` block
    #   DISABLE — comment it out again (an *empty* section also counts as
    #             absent, so commenting only the inner keys works too)
    #
    # Disabled means the round never builds the module: zero parameters,
    # zero overhead, and a forward pass bit-identical to plain ARACE
    # (tests assert exact equality, not just closeness).  The two compose
    # freely — enable either, both, or neither.
    #
    # THE FOUR-RUN ABLATION LADDER, from this one file:
    #   1. baseline  — as shipped, both blocks commented
    #   2. fragment  — uncomment fragment_interaction
    #   3. gate only — uncomment adaptive_gate
    #   4. full      — uncomment both
    # Either edit this file between runs, or drive it from the CLI without
    # touching the file at all (Hydra `+` adds a section, `~` removes one):
    #   goal-train --config-name simurgh_gmd26 \
    #     '+model.backbone.adaptive_gate={n_scalar:16,hard_threshold:0.5,aux_loss_weight:0.01,init_bias:1.0,per_irrep:true}'
    #   goal-train --config-name simurgh_gmd26 '~model.backbone.fragment_interaction'
    # Give each run its own task_name/run_name_suffix so the logs stay
    # separable, e.g. `task_name=simurgh_gmd26_full run_name_suffix=_full`.
    #
    # One round with both enabled:
    #
    #   artisan layer L  →  h_pair, E_L
    #        ↓ h_pair              ↓ h  (same pre-update features)
    #   ┌─────────────┐   ┌──────────────────────────────────┐
    #   │ ACE BRANCH  │   │ FRAGMENT BRANCH (optional)       │
    #   │ h_local     │   │ Δh = Σ_l TP(f_l, Y(r̂_kl); w(d)) │
    #   │             │   │ full irreps — l=0, l=1, l=2      │
    #   └─────────────┘   └──────────────────────────────────┘
    #        └────────── MIXING (+ RMS renorm) ──────────┘
    #                    ↓ h_new
    #   ┌────────────────────────────────────────────────────┐
    #   │ ADAPTIVE DEPTH GATE (optional)                     │
    #   │ h_next = g·h_new + (1-g)·h,  g per irrep block    │
    #   └────────────────────────────────────────────────────┘

    # ── Equivariant Fragment Interaction (optional) ─────────────────
    # WHAT: a convolution over the *fragment graph*, built from the same
    # e3nn primitives as the pair artisans.  Per round:
    #
    #   f_k  = mean_{i∈k} h_i                       pool full irreps
    #   c_k  = mean_{i∈k} r_i                       fragment centroid
    #   m_k  = Σ_l TP(f_l, Y^l(r̂_kl); w(d_kl))/n_k  equivariant message
    #   Δh_i = Linear(m_{frag(i)})                  per-atom correction
    #
    # Message passing only reaches as far as the bonded graph within
    # num_rounds × cutoff, so two fragments that share no covalent path
    # exchange information one bond at a time.  This gives them a direct
    # channel — and, unlike a scalar summary, one that carries WHERE the
    # other fragment is, through the spherical harmonics of the direction
    # between the centroids.
    #
    # EQUIVARIANCE: exact, at every angular order.  Pooling sums features
    # that already share the global frame; the tensor product of an
    # equivariant feature with Y^l(r̂), weighted by a function of the
    # invariant distance, is the standard e3nn convolution.  The
    # correction therefore spans l=0, l=1 AND l=2 — it is not restricted
    # to scalars.
    #
    # NOT ATTENTION: attention logits are invariant by necessity, so they
    # cannot see direction at all, and with the K=2 fragments typical of
    # this dataset a softmax over two tokens carries almost nothing.  The
    # radial weights w(d) already give a learned, continuous,
    # distance-dependent weighting, and the harmonics add the geometry
    # attention would have discarded.
    #
    # LOCALITY: fragment pairs are cut off at `cutoff` (defaults to the
    # backbone's neighbour radius) and tapered by the same polynomial
    # envelope as the radial basis, so energies stay local, forces stay
    # smooth, and a structure's energy never depends on a fragment
    # arbitrarily far away.  Pairs are also confined to one structure, so
    # mini-batch composition cannot change a prediction.
    #
    # A LONE FRAGMENT (K=1) has nothing to interact with: the correction
    # is exactly zero, so this module is a strict no-op on single-molecule
    # datasets (MD17 and friends) and only earns its keep where K ≥ 2 —
    # which GMD FragmentDuplication guarantees by construction.
    #
    # REQUIRES: data.compute_fragment_index: true (above).  A missing
    # fragment_index with this section enabled raises at the first forward.
    #
    # Uncomment the block below to enable; comment it out to disable.
    fragment_interaction:
      irreps_hidden:
        null # null = reuse artisan.hidden_irreps; set a
        #   narrower string to make the fragment channel
        #   cheaper than the atom-level one
      num_rbf: 8 # Bessel functions for the centroid separation
      radial_hidden: 32 # radial MLP width producing the TP weights
      num_layers:
        1 # 1 = convolution only; >1 adds residual
        #   EquivLinear+RMSNorm refinements
      init_zero:
        true # zero-init the output projection so the module
        #   starts as an exact no-op and learns to activate.
        #   Strongly recommended: switching it on cannot
        #   degrade a converged model at step 0.
      max_fragments:
        512 # guard: pair enumeration is O(K²), and a
        #   structure that shatters into single atoms
        #   (K = N) would be expensive.  Raises rather
        #   than silently crawling.
      cutoff:
        12.0 # max centroid separation (Å).  Omit to inherit the
        # backbone cutoff.  Raise it if your fragments are
        # large enough that their centroids sit further
        # apart than their nearest atoms.

    # ── Adaptive Depth Gate (optional) ──────────────────────────────
    # WHAT: a per-atom gate deciding how much of each round's update an
    # atom keeps.  Training uses SOFT gating
    # (h_next = g·h_new + (1-g)·h_prev, fully differentiable, every atom
    # still updates but the gate shapes each atom's gradient); inference
    # uses a HARD threshold, so converged interior atoms exit early and
    # boundary atoms keep getting rounds.
    #
    # EQUIVARIANCE: the gate value MUST be invariant — a gate that rotated
    # with the frame would scale different irrep blocks by
    # rotation-dependent factors and destroy the symmetry.  This is the
    # same construction as e3nn's own nn.Gate (invariant scalars gating
    # equivariant blocks), not a scalars-only shortcut.  Gate inputs are
    # the l=0 scalars plus convergence ratios ‖Δh‖/‖h_prev‖, all
    # invariant.  What `per_irrep` controls is how finely the gate
    # resolves the feature vector — see below.
    #
    # LOSS: adds λ·mean(g) to the total training loss (so it is inside
    # train/total), reported separately as train_gate/aux_loss.  No
    # `losses:` entry is needed — the weight lives here, on the module
    # that defines the term.
    #
    # LOGGING: gate diagnostics go to their own logger section,
    # train_gate/ and val_gate/, so they never crowd out the energy and
    # force metrics in train_energy/ / train_forces/ and their val
    # counterparts (see the LOGGER SECTIONS note at the end of this file).  Watch train_gate/gate_mean_round_{L}:
    #   ≈1.0 → gate always open, not selective (raise aux_loss_weight)
    #   ≈0.5 → gate is discriminating between atoms (healthy)
    #   →0   → whole rounds being skipped (lower aux_loss_weight)
    #
    # Uncomment the block below to enable; comment it out to disable.
    # adaptive_gate:
    #   n_scalar: 16 # width of the gate's scalar input projection
    #   hard_threshold: 0.5 # inference-time cut: g > threshold → update
    #   aux_loss_weight: 0.01 # λ on the sparsity penalty; 0.0 disables it
    #   init_bias: 1.0 # initial gate-logit bias → sigmoid(1) ≈ 0.73, i.e.
    #                  #   the gate starts OPEN (model begins as plain
    #                  #   ARACE and must learn to close specific atoms —
    #                  #   far more stable than starting closed).  Raise
    #                  #   to ~2.5 (≈0.92) to start even more open.
    #   per_irrep: true # one invariant gate PER IRREP BLOCK (l=0, l=1, l=2)
    #                   #   instead of one for the whole vector, with a
    #                   #   convergence ratio per block as extra input.
    #                   #   Still exactly equivariant, strictly more
    #                   #   expressive: the model can keep an atom's l=1
    #                   #   update while damping a noisy l=2 one.
    #                   #   false restores the single-gate behaviour.

  # ── Task head ──────────────────────────────────────────────────────
  # The ARACE backbone populates NodeFeatures.node_energies, so the
  # head sums it directly to get total energy.
  #
  # Forces = hybrid mode: F = -∂E/∂r (autograd, conservative, leading
  # term) + correction_weight × F_direct (equivariant 1x1o projection
  # of the artisan node features, a learnable non-conservative
  # residual).  correction_weight is kept small so the autograd term
  # dominates and the model stays close to energy-conserving.
  # Requires irreps_in to contain 1o channels — the default
  # artisan.hidden_irreps ("16x0e + 16x1o + 16x2e") already does.
  #
  # Other dual_forces modes: "autograd" (pure -∂E/∂r, same as
  # energy_forces), "direct" (pure equivariant projection, cheap but
  # non-conservative).  "pairwise" is NOT supported here — it needs
  # features.node_forces, which SimurghAraceBackbone never populates.
  #
  # irreps_in must match the artisan equivariant width — interpolated
  # from model.backbone.artisan.hidden_irreps so they never drift.
  head:
    name: energy_forces
    irreps_in: ${model.backbone.artisan.hidden_irreps}
    hidden_dim: 128
    # mode: hybrid
    # correction_weight: 0.05

# ─────────────────────────────────────────────────────
# TRAINER
# ─────────────────────────────────────────────────────
# This section is passed directly to lightning.pytorch.Trainer.
# trainer.max_epochs is authoritative — it controls how many epochs
# Lightning runs. Do NOT set training.max_epochs; it has no effect.
#
# accelerator options: "cpu", "gpu", "mps", "tpu", "auto"
# devices: integer or "auto"
#
# precision options:
#   "32-true"   / "32"      — float32 (default, safest)
#   "bf16-mixed"             — bfloat16 mixed (A100/H100/GH200, recommended)
#   "16-mixed"               — float16 mixed (older GPUs)
#   "64-true"   / "64"      — float64 (scientific computing)
#
# strategy options (simple strings for common cases):
#   "auto"   — Lightning chooses based on hardware
#   "ddp"    — DistributedDataParallel (model fits on one GPU)
#   "fsdp"   — FullyShardedDataParallel (model larger than one GPU)
#   "fsdp2"  — FSDP2 via ModelParallelStrategy (PyTorch 2.4+)
#   "deepspeed_zero1/2/3"  — DeepSpeed ZeRO stages
#   "deepspeed_zero3_offload" — DeepSpeed ZeRO-3 + CPU offload
#
# For multi-GPU: set devices=N and strategy="ddp" or "fsdp".
# For multi-node: also set num_nodes=M.
# ─────────────────────────────────────────────────────
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}

  # Epoch budget — max_epochs is THE authoritative epoch count.
  min_epochs: 10 # prevents premature early stopping
  max_epochs: 1500 # total epochs; scheduler T_max follows this value

  accelerator: gpu # change to "gpu" for CUDA training
  devices: 1
  num_nodes: 1
  precision: "32" # use "bf16-mixed" on A100/H100 for ~2x speedup

  # Strategy — "auto" works for single-GPU and CPU.
  # For DDP: strategy: ddp (and set devices: N, accelerator: gpu)
  # For FSDP: strategy: fsdp (and precision: bf16-mixed)
  # For DeepSpeed: strategy: deepspeed_zero2 or deepspeed_zero3
  # NOTE: when using a non-"auto" strategy, also configure the
  # distributed section below to tune the strategy parameters.
  strategy: auto

  # Validation cadence
  check_val_every_n_epoch: 1 # validate every N epochs
  val_check_interval:
    null # null = epoch-only; float(0,1] = fraction of epoch;
    # int >= 1 = every N training batches

  # Logging
  log_every_n_steps: 1

  # Gradient clipping — set null here; handled by training.gradient_clip
  # (GOALModule.on_before_optimizer_step). Lightning refuses both at once.
  gradient_clip_val: null
  gradient_clip_algorithm: "norm"

  # Gradient accumulation — simulate larger batch sizes
  # e.g. accumulate_grad_batches=4, batch_size=8 → effective batch=32
  accumulate_grad_batches: 1

  # Validation sanity check before training starts
  # 0 = skip entirely; -1 = run full validation set; N = run N batches
  num_sanity_val_steps: 2

  # Autograd-based force heads need gradient tape during eval/test.
  # MUST be false — torch.enable_grad() inside step hooks only works
  # when inference_mode=false. (Lightning 2.6+ default is true.)
  inference_mode: false

  # Misc
  deterministic: false # true = reproducible but slower
  detect_anomaly: false # true = raises on NaN/Inf (debug only)
  enable_model_summary: true
  enable_progress_bar: true
  sync_batchnorm: false # true = sync BatchNorm across GPUs (DDP)

# ─────────────────────────────────────────────────────
# TRAINING HYPERPARAMETERS
# ─────────────────────────────────────────────────────
training:
  # Gradient clipping — applied by GOALModule, not Lightning Trainer.
  # 10.0 is conservative for equivariant networks; reduce to 1.0 if
  # seeing explosive gradients in early training.
  # 0.0 = disabled.
  gradient_clip: 10.0

  # Checkpoint output directory
  checkpoint_dir: ${paths.output_dir}/checkpoints

  # torch.compile (PyTorch 2.0+, requires CUDA for best effect)
  # compile_model: true enables torch.compile on the backbone.
  # mode options: "default", "reduce-overhead", "max-autotune"
  #   Start with "default"; use "max-autotune" for final production runs.
  compile_model: false
  compile:
    mode: "default"
    fullgraph: false # true = compile entire graph (faster but stricter)
    dynamic: null # null | true | false — dynamic shape support

  # SLURM auto-requeue support.
  # true = attach SLURMEnvironment plugin; SLURM restarts jobs on preemption.
  slurm_mode: false

  # ── Performance settings ─────────────────────────────────────────
  performance:
    # TF32 matmul precision (only effective on Ampere+ GPUs: A100, RTX 30xx+)
    # "highest" — full float32 (default, safest, required for CPU)
    # "high"    — TF32 tensor cores (~3x speedup, negligible precision loss)
    # "medium"  — aggressive TF32
    float32_matmul_precision: highest

    # cuDNN algorithm auto-tuning (only with CUDA)
    # true = faster after warmup, adds startup overhead
    cudnn_benchmark: false

    # Deterministic cuDNN (true = slower, fully reproducible)
    cudnn_deterministic: false

  # ── Optimiser ────────────────────────────────────────────────────
  # AdamW with two parameter groups (equivariant params always get WD=0):
  #   group 1 — TP layers, EquivariantLinear: weight_decay = 0.0 always
  #   group 2 — MLP weights, gates, embeddings: weight_decay applies
  #
  # scheduler_type options:
  #   "cosine_warmup"    — linear warmup then cosine decay (recommended)
  #   "cosine"           — cosine decay from epoch 0
  #   "reduce_on_plateau"— halve LR when val/total stops improving
  #
  # Scheduler T_max = trainer.max_epochs (authoritative, not training.max_epochs).
  optimizer:
    lr: 0.01
    weight_decay: 1.0e-5
    amsgrad: true
    min_lr: 1.0e-7
    scheduler_type: cosine_warmup
    warmup_epochs: 10 # linear warmup duration (cosine_warmup only)
    scheduler: # reduce_on_plateau settings
      patience: 50
      factor: 0.5

  # ── Exponential Moving Average ───────────────────────────────────
  # Shadow weights used for validation and testing.
  # decay=0.99 → half-life ≈ 69 steps; 0.999 → ≈ 693 steps.
  # Disable to use Lightning's native EMAWeightAveraging callback instead
  # (configure it in the callbacks section below).
  ema:
    enabled: true
    decay: 0.99

  # ── Position noise augmentation ─────────────────────────────────
  # Adds Gaussian noise σ to atom positions at each training step.
  # Improves force generalisation; 0.005 Å is conservative.
  # 0.0 = disabled.
  position_noise_std: 0.0

  # ── Stage curriculum ─────────────────────────────────────────────
  # Training proceeds through stages with different loss weights.
  # Stage i runs for epochs_i epochs; the last stage with epochs=null
  # runs until training ends (early stopping or max_epochs).
  #
  # loss_weights override the per-component weights in `losses` below
  # for the duration of that stage. Labels not declared in `losses`
  # are silently skipped (forward-declaration is allowed).
  #
  # Rationale for the three-stage curriculum:
  #   Stage 1 — energy only: warm up the backbone on energies alone.
  #             Forces are noisy early when the energy surface is wrong.
  #   Stage 2 — add forces: once energy is stable, add force supervision.
  #   Stage 3 — full: add Newton violation penalty, increase force weight.
  stages:
    - name: "energy_only"
      epochs: 5
      loss_weights:
        energy: 1.0
        forces: 0.0
        newton: 0.0
        gate_reg: 1.0e-4

    - name: "energy_forces"
      epochs: null
      loss_weights:
        energy: 1.0
        forces: 1.0
        newton: 0.0
        gate_reg: 1.0e-4

    # - name: "full"
    #   epochs: null # open-ended — runs to max_epochs
    #   loss_weights:
    #     energy: 1.0
    #     forces: 1.0
    #     newton: 0.01
    #     gate_reg: 1.0e-4

  # ── Loss functions ────────────────────────────────────────────────
  # Declares which loss components exist and their base weights.
  # Base weights apply when no stage is active OR between stages.
  # Stage loss_weights above override these during training.
  #
  # fn options: "mse", "mae", "rmse", "huber", "smooth_l1"
  #   mae  — robust to outliers, recommended for atomistic data
  #   mse  — penalises large errors harder
  #   rmse — sqrt(mse), same units as mae
  #
  # Composite fn (multiple sub-losses per property):
  #   fn:
  #     - name: mse
  #       weight: 4.0
  #     - name: mae
  #       weight: 1.0
  #
  # normalize_by_n_atoms: true = divide force loss by atom count per structure.
  #   Removes size dependence. Essential for multi-molecule datasets where
  #   large molecules would otherwise dominate the gradient.
  #   false = flat mean over all atoms (old behaviour; large mols dominate).
  #
  # Available built-in losses (name field):
  #   "energy"          — per-atom energy MAE/MSE
  #   "forces"          — atomic forces MAE/MSE
  #   "stress"          — virial stress (periodic systems)
  #   "newton"          — Newton violation penalty (force conservation)
  #   "gate_reg"        — L2 on artisan gate params (prevents expert collapse)
  #   "dipole"          — dipole moment
  #   "scalar_property" — generic scalar, set property_name
  #
  # NOT declared here: "aux_loss".  When a model emits its own
  # regularisation term (currently only the ARACE adaptive depth gate's
  # λ·mean(g) sparsity penalty) GOALModule adds it to `total` and logs it
  # as train/aux_loss automatically.  Its weight is
  # model.backbone.adaptive_gate.aux_loss_weight — deliberately kept next
  # to the module that defines the term rather than duplicated here.
  losses:
    - name: energy
      fn: mae
      weight: 1.0
      normalize_by_n_atoms: true

    - name: forces
      fn: mae
      weight: 1.0
      normalize_by_n_atoms: true

    - name: gate_reg
      fn: mse
      weight: 1.0e-4

    # Newton violation (force conservation penalty) — included in stages
    # but only active when loss_weights.newton > 0:
    # - name: newton
    #   fn: mse
    #   weight: 0.01

  # Strict stage label validation.
  # false = silently skip unknown stage labels (default, allows forward-decl)
  # true  = raise ValueError if a stage names a label not in losses above
  strict_stage_labels: false

# ─────────────────────────────────────────────────────
# CHECKPOINTING
# ─────────────────────────────────────────────────────
# Three independent checkpoint pools managed by GOALCheckpointManager:
#
#   pool 1 — top_k: best K checkpoints by validation metric.
#     Keeps the K lowest (mode=min) or highest (mode=max) metric values.
#     When a new checkpoint beats the worst in the pool, the worst is
#     deleted and replaced. A checkpoint worse than all K is not saved.
#
#   pool 2 — interval: last N checkpoints at fixed epoch intervals.
#     Saves every `every_n_epochs` epochs; keeps only the last `keep_last_n`.
#     When saving the (N+1)th, the oldest is deleted first.
#
#   pool 3 — last: always overwrite last.ckpt after every epoch.
#     Never deleted. Used exclusively for crash recovery / auto-resume.
#
# metric options (any metric logged at validation time — note the
# section prefix: force curves live in val_forces/, energy curves in
# val_energy/, and only the loss total is in plain val/):
#   "val_forces/forces_mae"               — force MAE (min)
#   "val_forces/forces_cosine_similarity" — force direction similarity (max)
#   "val_energy/energy_mae_per_atom"      — per-atom energy MAE (min)
#   "val/total"                           — total weighted loss (min)
#
# Select on the ID validation set only.  With
# data.monitor_test_during_training the OOD set is logged every epoch
# under test/, test_energy/ and test_forces/ — watch those curves, but
# never point top_k.metric or early_stopping.monitor at them: selecting
# on a set turns it into a second validation set and the OOD number
# stops meaning anything.
#
# Atomic writes (write .tmp then os.replace) prevent corrupted files.
# Pool state is persisted to checkpoint_state.json for correct resume.
# ─────────────────────────────────────────────────────
checkpoint_manager:
  _target_: goal.ml.training.callbacks.checkpoint_manager.GOALCheckpointManager
  dirpath: ${paths.output_dir}/checkpoints

  top_k:
    enabled: true
    k: 5
    metric: "val_forces/forces_mae"
    mode: "min" # "min" for error metrics, "max" for similarity metrics

  interval:
    enabled: true
    every_n_epochs: 2
    keep_last_n: 5

  last:
    enabled: true
    filename: "last.ckpt"

  # Self-contained .simurgh archives (weights + resolved config +
  # metadata + frozen model source in a single shippable zip).
  # The model source is always frozen to {dirpath}/frozen_source/ at
  # training start; these knobs only control archive packing.
  save_archive: true # pack best checkpoint at end of training
  archive_interval: false # also pack at every interval checkpoint (large!)

# ─────────────────────────────────────────────────────
# CALLBACKS
# ─────────────────────────────────────────────────────
# Each callback is enabled/disabled inline here.
# GOALCheckpointManager above is always active for SIMURGH experiments.
#
# Available Lightning callbacks (enable by uncommenting):
#
#   EarlyStopping — stop when metric plateaus.
#   BackboneFinetuning — gradual layer unfreezing for fine-tuning.
#   EMAWeightAveraging — Lightning's native EMA (alternative to training.ema).
#     If using this, set training.ema.enabled: false to avoid double EMA.
#   GradientAccumulationScheduler — ramp up accumulation during training.
#   StochasticWeightAveraging — SWA (alternative to EMA; mutually exclusive).
#   ThroughputMonitor — log samples/sec to identify data bottlenecks.
#   RichModelSummary — print model architecture summary.
#   GOALRichProgressBar — stage-aware progress bar (always active via code).
#   LearningRateMonitor — log LR per epoch (always active via code).
# ─────────────────────────────────────────────────────
callbacks:
  # Stage-aware progress bar (prepends "[stage_name epoch/total]" prefix)
  rich_progress_bar:
    _target_: goal.ml.training.callbacks.progress.GOALRichProgressBar

  # Model architecture summary at startup
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 1 # nesting depth to display (-1 = all)

  # Early stopping — uncomment to enable:
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    # Check right after validation, not at the end of the training epoch:
    # a run resumed from a checkpoint saved after validation first closes
    # that finished epoch with no metrics logged, which strict mode rejects.
    check_on_train_epoch_end: false
    monitor: "val_forces/forces_mae"
    patience: 50 # epochs with no improvement before stopping
    mode: "min"
    min_delta: 1.0e-4 # minimum improvement to count
    strict: true # crash if monitor not found in metrics
    check_finite: true # stop if monitor becomes NaN or Inf
    stopping_threshold: null # stop immediately if metric < threshold
    divergence_threshold: null # stop if metric > threshold (diverging)

  # Backbone finetuning (for transfer learning from pretrained models):
  # backbone_finetuning:
  #   _target_: lightning.pytorch.callbacks.BackboneFinetuning
  #   unfreeze_backbone_at_epoch: 10
  #   backbone_initial_ratio_lr: 0.1
  #   should_align: true
  #   verbose: true

  # Lightning native EMA (alternative to training.ema; disable training.ema first):
  # ema_weight_averaging:
  #   _target_: lightning.pytorch.callbacks.EMAWeightAveraging
  #   decay: 0.999

  # Dynamic gradient accumulation ramp-up:
  # grad_accumulation:
  #   _target_: lightning.pytorch.callbacks.GradientAccumulationScheduler
  #   scheduling: {0: 1, 10: 2, 20: 4}  # epoch: accumulation_steps

  # Stochastic Weight Averaging (mutually exclusive with EMA):
  # swa:
  #   _target_: lightning.pytorch.callbacks.StochasticWeightAveraging
  #   swa_lrs: 1.0e-4
  #   swa_epoch_start: 0.75  # start SWA at this fraction of max_epochs
  #   annealing_epochs: 10
  #   annealing_strategy: cos

  # Throughput monitor (logs samples/sec — useful for profiling):
  # throughput_monitor:
  #   _target_: lightning.pytorch.callbacks.ThroughputMonitor
  #   window_size: 100   # rolling window size (batches)

# ─────────────────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────────────────
# ── LOGGER SECTIONS (what lands where in W&B / TensorBoard) ─────────
# The text before the first "/" is the section a curve is filed under.
# GOALModule splits three ways: by SPLIT (train / val / test), by
# PROPERTY (energy / forces), and by what you monitor vs what you only
# occasionally inspect (the gate curves).
#
# The split prefix:
#   train   the training batches
#   val     the val_dir set — IN DISTRIBUTION here (GMD TestID), and the
#           only set anything may be selected on (top_k, early stopping)
#   test    the test_dir set — OUT OF DISTRIBUTION here (GMD TestOOD).
#           Logged every validation epoch alongside val when
#           data.monitor_test_during_training is on, otherwise only by an
#           explicit trainer.test() run.  Read it, never select on it.
#
# and the section suffix:
#
#   {split}/              — the run's verdict, one curve:
#         total                     (the weighted loss actually optimised)
#       plus any loss component that is neither energy nor forces.
#
#   {split}_energy/       — everything about the energy:
#         energy                    (its weighted loss component)
#         energy_mae_per_atom, energy_rmse_per_atom
#         energy_round_{L}          (per-ARACE-round energy share)
#
#   {split}_forces/       — everything about the forces:
#         forces                    (its weighted loss component)
#         forces_mae, forces_rmse, forces_magnitude_mae
#         forces_cosine_similarity
#         newton_violation_x, _y, _z, newton_violation
#
#   {split}_gate/         — every gate diagnostic, so the
#       sections above stay readable — they are numerous (one per round,
#       plus one per element pair per round) and none of them is on the
#       progress bar:
#         gate_mean_round_{L}       (adaptive depth gate, per round)
#         aux_loss                  (the gate's λ·mean(g); still inside
#                                    train/total)
#         gate_reg                  (L2 on the artisan gates)
#         artisan/round{L}/{pair}   (per-element-pair artisan gates —
#                                    K*(K+1)/2 x num_rounds curves, the
#                                    noisiest group by far.  Logged on
#                                    train AND val: they are parameters,
#                                    so reading them is free.  A gate
#                                    drifting to ~0 means that element
#                                    pair has been switched off.)
#         artisan_load/{pair}       (load balance: mean |E| contributed
#         artisan_load_variance      per artisan, and std/mean across
#                                    them — >2.0 signals collapse.
#                                    val_gate/ ONLY, because it costs a
#                                    full extra forward of every artisan;
#                                    and only the legacy ACE-first
#                                    backbone exposes it, so ARACE runs
#                                    simply do not emit these.)
#
# NEWTON VIOLATION is reported per Cartesian axis plus a total
# (total = x + y + z exactly).  Σ_i F_i must vanish for an isolated
# molecule; one number tells you it is broken, three tell you where.
# Anisotropy (e.g. z far worse than x/y) points at a direction-dependent
# cause — surface normal, cell vector, PBC flag, an unbalanced direct
# force head — while three comparable values point at an isotropic one.
# It is a *diagnostic*, not a loss: it is always computed, whether or not
# a newton loss component is declared under training.losses.
#
# Multiple loggers can be active simultaneously.
# Metrics are logged to all enabled loggers.
#
# CSV is always available (no external dependencies).
# W&B requires: wandb login (or WANDB_API_KEY env var)
# TensorBoard: view with: tensorboard --logdir logs/
# MLflow: requires mlflow server; view with: mlflow ui
# Neptune: requires NEPTUNE_API_TOKEN env var
# Aim: view with: aim up (creates .aim folder in repo)
# Comet: requires COMET_API_TOKEN env var
#
# Uncomment logger blocks to activate them.
# ─────────────────────────────────────────────────────
logger:
  # CSV logger — always enabled as fallback
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: "${paths.output_dir}"
    name: "csv_logs"
    prefix: ""

  # Weights & Biases (recommended for research tracking):
  wandb:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    name: ${run_name} # format: YYYY-MM-DD_HH-MM-SS_trajectory_simurgh
    project: "goal"
    entity: null # null = your default W&B entity
    save_dir: "${paths.output_dir}"
    offline: false
    id: null # set to resume a specific W&B run
    log_model: false # true = upload checkpoints to W&B
    group: ""
    tags: ["simurgh", "gmd"]

  # TensorBoard:
  # tensorboard:
  #   _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
  #   save_dir: "${paths.output_dir}/tensorboard"
  #   name: "tb_logs"
  #   log_graph: false
  #   default_hp_metric: true

  # MLflow:
  # mlflow:
  #   _target_: lightning.pytorch.loggers.mlflow.MLFlowLogger
  #   experiment_name: "simurgh-gmd"
  #   tracking_uri: "http://localhost:5000"
  #   tags: null

  # Neptune:
  # neptune:
  #   _target_: lightning.pytorch.loggers.neptune.NeptuneLogger
  #   api_key: ${oc.env:NEPTUNE_API_TOKEN}
  #   project: "your-workspace/goal"
  #   log_model_checkpoints: true

  # Aim (local, no cloud):
  # aim:
  #   _target_: aim.pytorch_lightning.AimLogger
  #   repo: ${paths.log_dir}/aim
  #   experiment: "simurgh-gmd26"
  #   system_tracking_interval: 10   # seconds; null = disable system metrics
  #   log_system_params: true
  #   capture_terminal_logs: false   # avoid console log loop

  # Comet:
  # comet:
  #   _target_: lightning.pytorch.loggers.comet.CometLogger
  #   api_key: ${oc.env:COMET_API_TOKEN}
  #   project_name: "goal-simurgh"
  #   offline: false

# ─────────────────────────────────────────────────────
# DISTRIBUTED TRAINING
# ─────────────────────────────────────────────────────
# Configure the selected strategy here.
# trainer.strategy selects which strategy to use.
# Parameters below tune the selected strategy.
#
# DDP (trainer.strategy: "ddp"):
#   Use when model fits on one GPU. Replicates model across GPUs.
#   Multi-GPU: trainer.devices=4, trainer.accelerator=gpu, strategy.name=ddp
#   Multi-node: trainer.num_nodes=4 additionally
#
# FSDP (trainer.strategy: "fsdp"):
#   Use when model does not fit on one GPU. Shards params + grads + opt states.
#   Recommended precision: bf16-mixed on A100/H100.
#   FSDP2 (trainer.strategy: "fsdp2"): next-gen FSDP with per-param sharding,
#   native torch.compile support, FP8 compatibility (PyTorch 2.4+).
#
# DeepSpeed (trainer.strategy: "deepspeed_zero1/2/3"):
#   ZeRO-1: optimizer state partitioning only (lowest overhead)
#   ZeRO-2: + gradient partitioning (~8x memory vs DDP)
#   ZeRO-3: + parameter partitioning (maximum memory savings)
#   ZeRO-3 + offload: move params/optimizer to CPU RAM (extremely slow)
#   Requires: pip install deepspeed
#
# 32-GPU example:
#   trainer.devices: 8
#   trainer.num_nodes: 4
#   trainer.strategy: "ddp"
# ─────────────────────────────────────────────────────
strategy:
  name: auto # "auto", "ddp", "fsdp", "fsdp2", "deepspeed_zero1/2/3"

  # DDP options (active when name: "ddp")
  find_unused_parameters: false # true only for frozen backbone layers
  static_graph: false # true for fixed computation graphs (faster)
  gradient_as_bucket_view: true # shares grad storage with DDP buckets
  bucket_cap_mb: 25 # gradient all-reduce bucket size (MB)
  process_group_backend: nccl # "nccl" for GPU, "gloo" for CPU

  # FSDP / FSDP2 options (active when name: "fsdp" or "fsdp2")
  auto_wrap_policy: size # "size", "transformer", or null (whole model)
  size_based_min_params: 1000000 # wrap modules with > N params (FSDP)
  # size_based_min_params: 500000  # smaller threshold for FSDP2
  activation_checkpointing: true # recompute activations in backward (~40% mem savings)
  cpu_offload: false # offload params to CPU RAM (last resort, very slow)
  sharding_strategy: full_shard # "full_shard" | "shard_grad_op" | "no_shard"
  state_dict_type: full # "full" | "sharded" | "local"

  # DeepSpeed options (active when name: "deepspeed_*")
  stage: 3 # ZeRO stage (1, 2, or 3)
  offload_optimizer: false # move optimizer states to CPU
  offload_parameters: false # move parameters to CPU (ZeRO-3 only)
  overlap_comm: true # overlap communication with computation
  contiguous_gradients: true # contiguous gradient buffer (reduces fragmentation)
  allgather_bucket_size: 200000000 # all-gather bucket (bytes)
  reduce_bucket_size: 200000000 # reduce bucket (bytes)
  logging_level: 30 # 30=WARNING, 20=INFO, 10=DEBUG

# ─────────────────────────────────────────────────────
# PERFORMANCE
# ─────────────────────────────────────────────────────
# Global PyTorch performance settings applied before training.
# See training.performance for the per-run settings consumed by train.py.
# These are documented here for reference — the code reads from training.performance.
#
# float32_matmul_precision:
#   "highest" — full float32 (default; required for CPU and pre-Ampere GPUs)
#   "high"    — TF32 tensor cores on Ampere+ GPUs (~3x speedup)
#   "medium"  — more aggressive TF32
#
# torch.compile:
#   Set training.compile_model: true to enable.
#   mode: "default" → start here; "max-autotune" → production runs.
#   fullgraph: true → compile entire graph (faster inference, stricter).

# ─────────────────────────────────────────────────────
# RESUME / EXTEND
# ─────────────────────────────────────────────────────
# An INTERRUPTED run picks itself up with nothing set here: on launch,
# training.checkpoint_dir/last.ckpt is loaded if it exists, and the
# GOALCheckpointManager pools are restored from checkpoint_state.json.
#
# This block is for continuing a run that ALREADY FINISHED. Raise the
# budget and point resume.from at the old run's checkpoints:
#
#   goal-train --config-name <this file> \
#       trainer.max_epochs=3000 \
#       resume.from=logs/<task_name>/runs/<old_run>/checkpoints
#
# The continued run writes its own checkpoints under its own output
# directory; the old run's files are read for pool ranking but never
# deleted. A launch with nothing left to train (max_epochs already
# reached) exits immediately — which is what stops SLURM from requeueing
# a completed job.
resume:
  # Run directory, checkpoint directory, or .ckpt file to continue from.
  # null = this run's own training.checkpoint_dir (plain auto-resume).
  from: null

  # What to do with the restored LR schedule when max_epochs changes.
  # Lightning restores T_max / base_lrs / last_epoch from the checkpoint,
  # so the new budget never reaches the scheduler on its own — and since
  # CosineAnnealingLR is periodic with period 2*T_max, the LR would climb
  # BACK UP its curve over the added epochs, undoing the run.
  #   stretch — re-aim the schedule at the new budget: the LR lands where
  #             a run configured with the new max_epochs from the start
  #             would be at this epoch, and keeps annealing down.
  #   restart — fresh cosine cycle over the added epochs only, from
  #             training.optimizer.lr (SGDR-style warm restart).
  #   keep    — leave the restored schedule as-is (the old behaviour;
  #             only for reproducing a pre-existing resume).
  lr_schedule: stretch

# Dataset statistics derived from the training set before the model is built
# (elements, atomic reference energies, scale, avg_num_neighbors, pair_counts).
# goal-train records them in checkpoints/config.yaml, with the dataset they
# came from, and reuses them when this run is resumed or extended — they are
# not recomputed, and the model is rebuilt exactly as trained even if the
# training data has changed since (a change is reported).
dataset_stats:
  # Reuse the values recorded with the checkpoint on resume / extension.
  reuse: true
  # Statistics to derive again anyway, or "all": elements, atomic_energies,
  # scale, avg_num_neighbors, pair_counts.  An explicit value under
  # model.backbone is kept; otherwise it is computed from the current data.
  # scale / atomic_energies / avg_num_neighbors can always be changed;
  # elements / pair_counts shape the model, so they only work on resume if
  # the result still matches the checkpoint.
  recompute: []

# ckpt_path: legacy alias for resume.from — still honoured, and the key
# goal-eval reads to pick a checkpoint to evaluate.
ckpt_path: null

