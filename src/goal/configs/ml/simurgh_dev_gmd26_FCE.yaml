########################################################
# SIMURGH (simurgh_dev) on GMD-26 FragmentChainExtension
# Training: C2-C6 alkanes; OOD: longer alkanes.
# Validation = TestID (checkpoint selection); TestOOD is logged as test_*
# every epoch and never selected on.
#
#   goal-train --config-name simurgh_dev_gmd26_FCE
########################################################

defaults:
  - simurgh_dev/_base
  - _self_

experiment:
  name: "simurgh_dev_gmd26_FCE"
  description: "SIMURGH on GMD-26 FragmentChainExtension"
  tags: ["simurgh", "simurgh_dev", "gmd", "FragmentChainExtension"]

task_name: "simurgh_dev_gmd26_FCE"

data:
  task: fragment_chain_extension # GMD from the Hugging Face Hub, downloaded on first use
  root: ${paths.data_dir}/GMD # graph cache (raw files: the Hugging Face cache)
  fragment_smarts: ["[CX4]-[CX4]"]

# Multi-scale fragment consistency: on in the GMD configs (half-space
# windows, two levels, b = r_c); its removal is an ablation arm.
model:
  backbone:
    mfc:
      enabled: true
