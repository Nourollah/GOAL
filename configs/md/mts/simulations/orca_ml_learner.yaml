# Complete workflow: ORCA (base) + ML learner
defaults:
  - /md/molecule/ethanol
  - /md/mts/base_calculators/orca_reference
  - /md/mts/ml_models/learner
  - /md/mts/dynamics/langevin_mts

mts:
  enabled: true
  switching_strategy:
    type: accuracy_based
    force_rmse_threshold: 0.01
    energy_mae_threshold: 0.001
    min_training_steps: 500

num_steps: 5000
