# Quantum ESPRESSO (pw.x) calculator
# Requires: ASE >= 3.23 (EspressoProfile) and a pw.x build.
# Pseudopotentials: download an SSSP library and point `pseudo_dir` at it;
# list one UPF file per element in `pseudopotentials` (REQUIRED).

# Hydra instantiation metadata. These are commented out because this
# example uses GOAL's CalculatorFactory directly rather than
# hydra.utils.instantiate().
#  _target_: goal.md.core.calculator_factory.CalculatorFactory.create
#  _convert_: none

key: espresso

command: null            # null -> $ASE_ESPRESSO_COMMAND
pseudo_dir: null         # null -> $ESPRESSO_PSEUDO
pseudopotentials: {}     # REQUIRED, e.g. {H: H.pbe-rrkjus.UPF, O: O.pbe-rrkjus.UPF}
preset: molecular        # "molecular" (assume_isolated=mt) or "bulk" (kpts default [2,2,2])
kpts: null               # null = gamma point only
n_mpi: null
omp_threads: null
# elements: [H, C, O]    # optional: verify a pseudopotential exists per element

input_data:
  control:
    calculation: scf
    verbosity: low
  system:
    ecutwfc: 80          # Ry
    ecutrho: 640         # Ry
  electrons:
    conv_thr: 1.0e-8
