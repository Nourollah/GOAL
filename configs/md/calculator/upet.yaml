# UPET (metatensor PET) foundation-model calculator
# Requires: pip install upet
# Models (upet._version.UPET_AVAILABLE_MODELS): pet-mad-{xs,s}, pet-omat-{xs,s,m,l,xl},
#   pet-oam-{l,xl}, pet-omad-{xs,s,l}, pet-omatpes-l, pet-spice-{s,l}

# Hydra instantiation metadata. These are commented out because this
# example uses GOAL's CalculatorFactory directly rather than
# hydra.utils.instantiate().
#  _target_: goal.md.core.calculator_factory.CalculatorFactory.create
#  _convert_: none

key: upet

model: pet-mad-s
version: null            # null = latest published weights; pin (e.g. "1.5.0") for reproducibility
checkpoint_path: null    # OR path to a fine-tuned metatrain .ckpt
variants: null           # null = each output's default head.
                         # Set {energy: finetune} for a fine-tuned energy head, or
                         # {energy: r2scan} to pick a named head. Do NOT use
                         # {energy: energy} — upet reads that as a head called
                         # "energy/energy" and raises ValueError.
device: cuda

# WARNING: non_conservative=true selects a DIRECT force head that VIOLATES
# energy conservation. Never use for production MD. Logged loudly if enabled.
# Unsupported by PET-SPICE and PET-MAD < 1.1.0.
non_conservative: false
