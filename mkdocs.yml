site_name: GOAL
site_description: General Open Atomistic Laboratory — machine-learning interatomic potentials (goal.ml) and molecular dynamics (goal.md)
site_author: Amir Masoud Nourollah
site_url: https://nourollah.github.io/GOAL/
repo_url: https://github.com/Nourollah/GOAL
repo_name: Nourollah/GOAL
edit_uri: edit/main/docs/
copyright: Copyright &copy; GOAL contributors — MIT License

docs_dir: docs
site_dir: site

# LaTeX sources and PDFs for talks live next to the docs but are not pages.
exclude_docs: |
  slides/

# With `mkdocs build --strict` (CI), any of these turns into a build failure.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nourollah/GOAL

theme:
  name: material
  logo: assets/goal-logo.png
  favicon: assets/goal-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - github-callouts # renders GitHub "> [!NOTE]" blocks, so pages look right on GitHub and on the site
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search

