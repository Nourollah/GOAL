[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goal"
version = "0.1.0"
description = "General Open Atomistic Laboratory — a modular framework for machine-learning interatomic potentials"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Amir Masoud Nourollah", email = "nourollah.am@gmail.com" }]
license = { text = "MIT" }
keywords = ["atomistic-simulation", "machine-learning", "interatomic-potentials", "equivariant", "gnn", "molecular-dynamics"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "torch>=2.4",
  "torch-geometric>=2.7.0",
  "e3nn>=0.5",
  "lightning>=2.6",
  "hydra-core>=1.3.2",
  "ase>=3.23",
  "wandb",
  "rich>=13",
  "rootutils",
  "hydra-colorlog",
  "lmdb", "pytest>=9.0.3,<10", "ipython>=9.13.0,<10", "xonsh>=0.23.7,<0.24", "jupyter>=1.1.1,<2", "ipykernel>=7.2.0,<8", "rdkit>=2026.3.3,<2027",
]

[project.optional-dependencies]
mace = ["mace-torch>=0.3.16"]
fairchem = ["fairchem-core>=1.0"]
matscipy = ["matscipy"]
nvalchemiops = ["nvalchemi-toolkit-ops[torch]"]
deepspeed = ["deepspeed>=0.14"]
tune = ["ray[tune]>=2.55.1", "optuna>=3.0"]
torchmetrics = ["torchmetrics>=1.9.0"]
examples = ["h5py>=3.10", "requests>=2.31"]
md = [
  "flashmd>=0.2.5,<0.3",
  "ase>=3.25.0,<4",
  "xtb-python>=22.1,<23",
  "tblite>=0.7.0,<0.8",
  "upet>=0.1.2,<0.3",
  "rdkit>=2025.9.3,<2026",
  "typer>=0.16.0,<0.17",
  "pandas>=2.3.0,<3",
  "ipi>=3.0",
]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]
all = ["goal[mace,fairchem,matscipy,nvalchemiops,deepspeed,tune,torchmetrics,examples,md]"]

[project.urls]
Repository = "https://github.com/Nourollah/GOAL"

[project.scripts]
goal-train = "goal.ml.cli.train:train_ml"
goal-train-ml = "goal.ml.cli.train:train_ml"
goal-eval = "goal.ml.cli.evaluate:evaluate"
goal-finetune = "goal.ml.cli.finetune:finetune"
goal-finetune-upet = "goal.ml.cli.finetune_upet:main"
goal-tune = "goal.ml.cli.tune:tune"
goal-simulate = "goal.md.cli.simulate:simulate"
goal-simulate-mts = "goal.md.cli.simulate:simulate_mts"
goal-inspect = "goal.ml.cli.inspect_ckpt:main"
goal-pack-archive = "goal.ml.cli.pack:main"

# src/ is the source root: packages under src/ are importable directly
# e.g. src/goal/ → import goal; src/goal/ml/ → from goal.ml import ...
[tool.setuptools.packages.find]
where = ["src"]
include = ["goal*"]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
  "integration: tests that require an actual foundation model / external engine installed",
]
minversion = "6.0"
testpaths = ["tests/", "tests/ml/", "tests/md/"]

[tool.coverage.report]
exclude_lines = [
  "pragma: nocover",
  "raise NotImplementedError",
  "raise NotImplementedError()",
  "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# Pixi workspace configuration (replaces pixi.toml)
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.14.*"
dftd3-python = ">=1.4.0,<2"
warp-lang = ">=1.11.1,<2"

[tool.pixi.pypi-dependencies]
goal = { path = ".", editable = true }
py3dmol = "*"

# --- Platform features ---

[tool.pixi.feature.cpu]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = ">=2.10"

[tool.pixi.feature.cuda]
platforms = ["linux-64"]

[tool.pixi.feature.cuda.dependencies]
pytorch-gpu = ">=2.10"

[tool.pixi.feature.cuda.pypi-dependencies]
jupyter = ">=1.1.1,<2"
ipykernel = ">=6"

[tool.pixi.feature.cuda.system-requirements]
cuda = "12.0"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7"
ruff = "*"
mypy = "*"
pre-commit = ">=3"

[tool.pixi.feature.dev.pypi-dependencies]
pytest-cov = "*"

# --- Optional adapter features ---
# Some optional deps have Python version or e3nn version conflicts with
# the core environment.  They are available as pip extras — install via:
#   pip install -e ".[fairchem]"       # FairChem adapter
#   pip install -e ".[nvalchemiops]"   # NVIDIA GPU neighbour list (CUDA-only)
#   pip install -e ".[tune]"           # Ray Tune + Optuna (needs Python ≤3.13)
#   pip install -e ".[all]"            # everything
#   For [mace], see "MACE (mace-torch)" below — the [mace] extra itself is NOT
#   installable (see why).
#
# Note: pixi's uv-managed envs don't ship a `pip` binary — use `uv pip install
# --python <env>/bin/python ...` instead of plain `pip install` inside them.
#
# Pixi features are provided where compatible.  Features that cannot be
# resolved in the pixi environment (e3nn conflict, missing cp314 wheels)
# are commented out — users should fall back to pip install for those.

# --- MACE (mace-torch) ---
# mace-torch hard-pins e3nn==0.4.4, while GOAL's own equivariant blocks (SIMURGH/
# ARACE etc.) require e3nn>=0.5 (currently 0.6.x). Because of that, `goal[mace]`
# (the [mace] extra) is unsatisfiable by construction — uv/pip must resolve both
# constraints in one graph and there is no version of e3nn that fits both.
#
# Don't try to satisfy this inside a pixi-managed environment, even an isolated
# one (`pixi install -e <name>` followed by a manual `uv pip install mace-torch`
# downgrade) — it looks like it works, but pixi doesn't track that downgrade, and
# the NEXT `pixi install`/`pixi run` (e.g. whatever launches your Jupyter kernel)
# silently reconciles e3nn back to what pixi.lock says (0.6.x), breaking mace_mp()
# again with a confusing "too many values to unpack" error deep in
# e3nn/util/codegen/_mixin.py — this happened during development and cost a lot
# of debugging before the cause (pixi env drift, not a real bug) was found.
#
# Instead, use a plain venv that pixi never touches:
#   uv venv --python 3.14 .venv-mace
#   uv pip install --python .venv-mace/bin/python torch --index-url https://download.pytorch.org/whl/cu126
#   uv pip install --python .venv-mace/bin/python -e .
#   uv pip install --python .venv-mace/bin/python "mace-torch>=0.3.16" jupyter ipykernel
#   .venv-mace/bin/python -m ipykernel install --user --name goal-mace-cuda \
#       --display-name "GOAL (mace-cuda, standalone)"
# Then select the "GOAL (mace-cuda, standalone)" kernel for MACE notebooks (e.g.
# notebooks/mof74_mn_bulk.ipynb) instead of any pixi-provided kernel.
#
# Also: e3nn==0.4.4's bundled Wigner-3j constants are loaded via a bare
# `torch.load(...)`, which torch>=2.6 now blocks by default (weights_only=True).
# Before importing mace/e3nn, run:
#   import torch; torch.serialization.add_safe_globals([slice])
# (already done in notebooks/mof74_mn_bulk.ipynb). Verified working end-to-end in
# `.venv-mace` with Python 3.14 + torch 2.13+cu126 + e3nn 0.4.4 + mace-torch 0.3.16
# — mace_mp() loads a real checkpoint on GPU, and goal.ml.data.graph.AtomicGraph
# (used by that notebook) still imports fine since it doesn't touch e3nn's API.

# [tool.pixi.feature.mace.pypi-dependencies]
# mace-torch = ">=0.3"            # conflicts: pins e3nn==0.4.4 — use the standalone .venv-mace instead (see above)

[tool.pixi.feature.fairchem.pypi-dependencies]
fairchem-core = ">=1.0"

[tool.pixi.feature.deepspeed.pypi-dependencies]
deepspeed = ">=0.14"

# nvalchemi-toolkit-ops: GPU-accelerated neighbour lists (CUDA-only).
# Requires the cuda pixi feature.  No cp314 wheels on PyPI yet — check
# https://github.com/nvidia/nvalchemi-toolkit-ops for availability.
# [tool.pixi.feature.nvalchemiops.pypi-dependencies]
# nvalchemi-toolkit-ops = { version = "*", extras = ["torch"] }   # no cp314 wheels yet

# [tool.pixi.feature.tune.pypi-dependencies]
# ray = { version = ">=2.9", extras = ["tune"] }  # no cp314 wheels yet
# optuna = ">=3.0"

[tool.pixi.feature.examples.pypi-dependencies]
h5py = ">=3.10"
requests = ">=2.31"

[tool.pixi.environments]
default = ["cpu"]
cuda = ["cuda"]
dev = ["cpu", "dev"]
dev-cuda = ["cuda", "dev"]
fairchem = ["cuda", "fairchem"]
cuda-deepspeed = ["cuda", "deepspeed"]
examples = ["cuda", "examples"]
# mace = ["cuda", "mace"]          # doesn't work — see "MACE (mace-torch)" comment above; use .venv-mace instead
# tune = ["cpu", "tune"]            # pip install -e ".[tune]" instead
# cuda-tune = ["cuda", "tune"]
# cuda-nvalchemiops = ["cuda", "nvalchemiops"]  # uncomment when cp314 wheels land

# --- Tasks ---

[tool.pixi.tasks]
clean = """
rm -rf dist build *.egg-info && \
find . -type f -name '*.DS_Store' -ls -delete && \
find . | grep -E '(__pycache__|\\.pyc|\\.pyo)' | xargs rm -rf && \
find . | grep -E '.pytest_cache' | xargs rm -rf && \
find . | grep -E '.ipynb_checkpoints' | xargs rm -rf && \
rm -f .coverage
"""
clean-logs = "rm -rf logs/**"
test = "pytest -k 'not slow'"
test-full = "pytest"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
typecheck = "mypy src/goal/ml/"
train = "python -c 'from goal.ml.cli.train import train_ml; train_ml()'"
train-ml = "python -c 'from goal.ml.cli.train import train_ml; train_ml()'"
eval = "python -m goal.ml.cli.evaluate"
finetune = "python -m goal.ml.cli.finetune"
simulate = "python -m goal.md.cli.simulate"
simulate-mts = "python -m goal.md.cli.simulate simulate_mts"

[dependency-groups]
cuda = ["jupyter", "ipykernel"]
